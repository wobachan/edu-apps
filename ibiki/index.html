/* 便利関数 */
const colH = c => state.cols[c].reduce((s, b) => s + b.n, 0);
const towerMax = () => { let m = 0; for (let c = 0; c < CONFIG.COLS; c++) m = Math.max(m, colH(c)); return m; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const screenY = h => GROUND_Y - (h - state.cam) * CONFIG.UNIT;   // 高さ→スクリーンY
const colX = c => FIELD_X + c * CONFIG.COL_W;

function drawNumber(){
  if (state.queue.length < 8){
    for (let i = 0; i < 8; i++) state.queue.push(NUM_BAG[(Math.random() * NUM_BAG.length) | 0]);
  }
  return state.queue.shift();
}

/* ==================== 4. Lock ── 中核ルール（固定判定） ====================
   隣り合う2本の柱を比べ、両方に共通する「高さの区切り」で挟まれた区間は
   合計がぴったり一致しているので固定（カチン！）。
       ４ ９
       ５        → 9 = 4 + 5      成立
       ２ ７
       ３        → 5 ≠ 7          不成立
       ６ ６      → 6 = 6          成立
       ２ ２
       ５ ５      → 5+2 = 5+2      成立（途中の 5 の高さも一致）
   組み合わせの個数は問わない。「高さがぴったり合っているか」だけを見る。
   数値配列だけで判定するので、設置プレビュー（予測）にも同じ関数を使う。
   ========================================================================= */
function prefixHeights(arr){
  const p = [0];
  for (let i = 0; i < arr.length; i++) p.push(p[i] + arr[i]);
  return p;
}
function indicesInRange(p, h1, h2){
  const out = [];
  for (let i = 0; i < p.length - 1; i++) if (p[i] >= h1 && p[i+1] <= h2) out.push(i);
  return out;
}
/** @param {number[][]} nums 各柱の数字配列（下→上）
 *  @returns {{tiers:number[][], segs:Array}} tiers は 0=未固定 / 1〜4=強度 */
function computeLocks(nums){
  const tiers = nums.map(a => a.map(() => 0));
  const segs = [];
  for (let c = 0; c < nums.length - 1; c++){
    const A = nums[c], B = nums[c+1];
    if (!A.length || !B.length) continue;
    const pa = prefixHeights(A), pb = prefixHeights(B);
    const setB = new Set(pb);
    const common = pa.filter(v => setB.has(v));           // 共通の区切り高さ
    for (let i = 0; i < common.length - 1; i++){
      const h1 = common[i], h2 = common[i+1];
      const ia = indicesInRange(pa, h1, h2);
      const ib = indicesInRange(pb, h1, h2);
      if (!ia.length || !ib.length) continue;
      // ★固定の条件
      //   ・1本 対 1本（5｜5）… 分けていないのでダメ
      //   ・3つ以上 対 3つ以上（3+4+5｜2+6+4）… たまたま頭がそろっただけなのでダメ
      //   2対2（3+4｜5+2）までは、数のまとまりが見えているのでOKにする。
      //   この線引きを外すと、てきとうに積むだけで6割近くが固まってしまう。
      if (ia.length + ib.length < 3) continue;
      if (Math.min(ia.length, ib.length) > 2) continue;
      segs.push({ c, h1, h2, ia, ib,
                  a: ia.map(i2 => A[i2]), b: ib.map(i2 => B[i2]) });
    }
  }

  // 高さ帯が重なって隣接する区間どうしをつなぎ、何列が一体になっているか数える
  const parent = segs.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  for (let i = 0; i < segs.length; i++){
    for (let j = i + 1; j < segs.length; j++){
      const s = segs[i], t = segs[j];
      if (Math.abs(s.c - t.c) !== 1) continue;                        // 柱を共有しない
      if (Math.max(s.h1, t.h1) >= Math.min(s.h2, t.h2)) continue;     // 高さ帯が重ならない
      const a = find(i), b = find(j);
      if (a !== b) parent[a] = b;
    }
  }

  /* 橋わたし：「6+2 ｜ 4+4」のような柱のない形は、単体では固定できない。
     ただし左右とも“すでに柱で固まっている”なら、そこは一体の壁とみなしてつなぐ。
     新たに固定されるブロックは増えず、れつ数（＝かたさ）だけが伸びる。
     てきとうに積んでも各柱が単独では固まらないので、抜け道にはならない。 */
  const owner = nums.map(a => a.map(() => -1));
  segs.forEach((s, i) => {
    s.ia.forEach(k => owner[s.c][k]     = i);
    s.ib.forEach(k => owner[s.c + 1][k] = i);
  });
  for (let c = 0; c < nums.length - 1; c++){
    const A = nums[c], B = nums[c+1];
    if (!A.length || !B.length) continue;
    const pa = prefixHeights(A), pb = prefixHeights(B);
    const setB = new Set(pb);
    const common = pa.filter(v => setB.has(v));
    for (let i = 0; i < common.length - 1; i++){
      const h1 = common[i], h2 = common[i+1];
      const ia = indicesInRange(pa, h1, h2);
      const ib = indicesInRange(pb, h1, h2);
      if (!ia.length || !ib.length) continue;
      if (Math.min(ia.length, ib.length) === 1) continue;       // それは本来の成立
      if (!ia.every(k => owner[c][k]     >= 0)) continue;       // 左が固まっていない
      if (!ib.every(k => owner[c+1][k]   >= 0)) continue;       // 右が固まっていない
      const a = find(owner[c][ia[0]]), b = find(owner[c+1][ib[0]]);
      if (a !== b) parent[a] = b;
    }
  }

  const groupCols = new Map();
  segs.forEach((s, i) => {
    const r = find(i);
    if (!groupCols.has(r)) groupCols.set(r, new Set());
    groupCols.get(r).add(s.c); groupCols.get(r).add(s.c + 1);
  });

  segs.forEach((s, i) => {
    // 「1本の柱を3つ以上に分けた」ときだけ rank2。
    // 2対2（3+4｜5+2）や たまたま合っただけの形は rank1 に留めて、
    // 偶然できたかたまりが がっちり・むてき まで育たないようにする。
    const few  = Math.min(s.ia.length, s.ib.length);
    const many = Math.max(s.ia.length, s.ib.length);
    s.rank  = (few === 1 && many >= 3) ? 2 : 1;           // 1: 9=4+5 / 2: 9=4+3+2
    s.width = groupCols.get(find(i)).size;                // 一体になっている列数
    s.score = s.rank + clamp(s.width - 2, 0, 3);          // 1〜5
    s.tier  = s.score <= 1 ? 1 : s.score <= 3 ? 2 : 3;
    s.ia.forEach(i2 => tiers[s.c][i2]     = Math.max(tiers[s.c][i2],     s.tier));
    s.ib.forEach(i2 => tiers[s.c+1][i2]   = Math.max(tiers[s.c+1][i2],   s.tier));
  });
  return { tiers, segs };
}

/** 成立した式の表示テキスト（1対多なら「9 = 4 + 5」の形にする） */
function segText(s){
  if (s.a.length === 1 && s.b.length > 1) return `${s.a[0]} = ${s.b.join(' + ')}`;
  if (s.b.length === 1 && s.a.length > 1) return `${s.b[0]} = ${s.a.join(' + ')}`;
  return `${s.a.join(' + ')} = ${s.b.join(' + ')}`;
}

/** 実際の盤面に固定判定を適用。強度が上がったブロックがあれば演出を出す。 */
function applyLocks(announce = true){
  const nums = state.cols.map(col => col.map(b => b.n));
  const { tiers, segs } = computeLocks(nums);
  const fresh = new Set();                     // 今回あらたに強くなった "柱:段"
  let newly = 0;
  for (let c = 0; c < CONFIG.COLS; c++){
    for (let i = 0; i < state.cols[c].length; i++){
      const b = state.cols[c][i], t = tiers[c][i];
      if (t > b.tier) { b.flash = 1; newly++; fresh.add(c + ':' + i); }
      b.tier = t;
    }
  }
  if (newly > 0 && announce){
    state.stats.locks++;
    // 強くなったブロックを含む区間のうち、いちばん上のものの式を表示
    const hit = segs.filter(s =>
      s.ia.some(i => fresh.has(s.c + ':' + i)) || s.ib.some(i => fresh.has((s.c+1) + ':' + i)));
    const seg = hit.sort((p, q) => q.h2 - p.h2)[0];
    const tier = seg ? seg.tier : 1;
    Sfx.lock(tier);
    if (seg){
      const x = colX(seg.c + 1);
      const y = (seg.h1 + seg.h2) / 2;
      const c = TIER[tier];
      addText(x, y, segText(seg), c.top);
      addText(x, y - 1.6, (tier >= 3 ? '★ ' : '') + c.name + (seg.width >= 3 ? ` ${seg.width}れつ！` : ''), c.top);
      for (let i = 0; i < 10 + tier * 8; i++) addSpark(x, y);
    }
  }
  return newly;
}

/** 予測：この柱に n を置いたら、そのブロックはどの強度になるか（0＝固定されない） */
function wouldLock(c, n){
  const nums = state.cols.map(col => col.map(b => b.n));
  nums[c] = nums[c].concat([n]);
  const { tiers } = computeLocks(nums);
  return tiers[c][nums[c].length - 1];
}

/* ============================ 5. Build ============================ */
/* 大魔王の頭のあたりから 夢石が生まれ、よこへ流れていく */
function spawnBeltBlock(){
  state.belt.push({ n: drawNumber(), x: cloudX0(), id: ++uid, ph: Math.random() * 6.28 });
}

/** 取り口にいる夢石（ふたりでも 同じ ひとつ） */
function pickable(p){
  const zx = zoneX();
  let best = null, bd = 1e9;
  for (const b of state.belt){
    const d = Math.abs(b.x - zx);
    if (d <= CONFIG.PICK_HALF && d < bd){ bd = d; best = b; }
  }
  return best;
}

/** ふたりのときは かわりばんこに とる（state.turn の人だけ とれる）。 */
function grab(p){
  if (p.held) { Sfx.deny(); return; }
  if (playerCount === 2 && state.turn !== p.id) { Sfx.deny(); return; }
  const b = pickable(p);
  if (!b) { Sfx.deny(); return; }
  state.belt = state.belt.filter(x => x !== b);
  p.held = { n: b.n };
  // 糸を のばして 引っかけ、手もとへ 引きよせる
  p.castFrom = { x: b.x, y: DREAM_MID + 2 };
  p.hero.castT = CAST_DUR;
  p.hero.swingT = 0.42;                 // さおを しゃくる
  if (playerCount === 2) state.turn = 1 - state.turn;   // つぎは あいての ばん
  Sfx.step();
}

/** どのシャフトも 建築禁止（ふたりのときは2本とも守る） */
const isShaft = c => state.players.some(p => p.hero.col === c);

function canPlace(p, c){
  if (!p.held) return false;
  if (isShaft(c)) return false;
  if (colH(c) + p.held.n > CONFIG.MAX_STACK) return false;
  return true;
}

/** 主人公が棒を上へ投げる。着地した瞬間に固定判定が走る。 */
function place(p, c){
  if (!p.held) { Sfx.deny(); return; }
  if (!canPlace(p, c)) {
    Sfx.deny();
    flashMsg(isShaft(c) ? 'ここは のぼりみち！' : 'もう つめない');
    return;
  }
  /* 「この夢を えらぶ」→ 夢石が ひかって 真下へ 自然落下する。
     主人公が下から投げるのではないので、物理的な違和感がない。 */
  const n = p.held.n;
  const base = colH(c);
  // 糸に ぶらさがっている ところから 落ちはじめる（下のはしの高さ）
  const hookY = (p.castFrom ? p.castFrom.y + hookPull(n) : DREAM_MID) + n * CONFIG.UNIT / 2;
  const dist  = Math.max(24, screenY(base) - hookY);
  const dur   = Math.sqrt(2 * dist / GRAVITY);

  state.cols[c].push({ n, tier: 0, id: ++uid, ph: Math.random()*6.28, flash: 0,
                       spawn: dur });
  const toX = colX(c) + CONFIG.COL_W/2;
  state.fx.drops.push({ n, x: toX, x0: p.castFrom ? p.castFrom.x : toX,
                        y0: hookY, t: 0, dur, glow: 1 });
  p.held = null; p.castFrom = null; p.hero.castT = 0;
  state.stats.placed++;
  p.hero.throwT = 0.35;                          // 主人公は 手をかざす
  Sfx.choose();
}

/* ============================ 6. Quake ============================ */
function updateQuake(dt){
  const q = state.quake;
  const k = QUAKE_KIND[q.kind];
  q.t -= dt;
  if (q.mode === 'idle' && q.t <= k.warn){
    q.mode = 'warn';
    q.mag = Math.min(1.35, 0.55 + q.count * 0.11) * k.magMul;
    Sfx.rumbleStart(q.kind === 'roll' ? 0.06 : 0.05);
    if (q.kind === 'pop') Sfx.inflate(k.warn);     // 鼻提灯がふくらむ音
    flashMsg(k.warnMsg, k.warn - 0.3);
  }
  if (q.mode === 'warn' && q.t <= 0){
    q.mode = 'shake';
    q.shake = q.shakeMax = k.shake;
    q.count++;
    state.stats.quakes++;
    if (q.kind === 'roll'){
      state.stats.rolls++;
      state.demon.rollU = 0.0001;        // 寝返りアニメ開始
      Sfx.roll();
      Sfx.rumbleSwell(0.55);             // 地鳴りも いちばん強く
      state.fx.flash = 0.9;              // パチン(0.55)より 強く光らせる
    } else {
      state.stats.pops++;
      state.demon.popT = 0.55;           // 鼻提灯がはじけた
      Sfx.pop();
      Sfx.rumbleSwell(0.42);             // はじけたあとも地面が鳴り続ける
      state.fx.flash = Math.max(state.fx.flash, 0.55);
    }
    flashMsg(k.hitMsg, 1.2);
    resolveTopple(q.mag);
  }
  if (q.mode === 'shake'){
    q.shake -= dt;
    if (q.shake <= 0){
      q.mode = 'idle';
      Sfx.rumbleStop();
      q.t = Math.max(CONFIG.QUAKE_INTERVAL_MIN, CONFIG.QUAKE_INTERVAL - q.count * 1.2);
      q.kind = ((q.count + 1) % CONFIG.ROLL_EVERY === 0) ? 'roll' : 'pop';
    }
  }

  // 寝返りアニメ（左右が反転して寝相が変わる）
  const dm = state.demon;
  if (dm.rollU > 0){
    dm.rollU += dt / CONFIG.ROLL_TURN;
    if (dm.rollU >= 1){ dm.rollU = 0; dm.flip = -dm.flip; }
  }
  if (dm.popT > 0) dm.popT = Math.max(0, dm.popT - dt);
}

/** 揺れによる崩壊。
    ・固定ブロックは「壁につっかえ棒が入った状態」なので、その下にある未固定ブロックまで守る。
      → 崩れるのは “いちばん上の固定ブロックより上にある未固定ブロック” だけ。
    ・固定ブロック自身は強度に応じてごくまれに壊れる（完全固定は絶対に壊れない）。
      壊れた場合はそこから上が落ちるので、土台こそ強く固めたい。 */
/** のぼりみちの すぐ となり（＝かべに つかう柱）か */
function isWallCol(c){
  return state.players.some(p => c === p.hero.col - 1 || c === p.hero.col + 1);
}

function resolveTopple(mag){
  let fell = 0, deadWall = false;
  for (let c = 0; c < CONFIG.COLS; c++){
    const col = state.cols[c];
    if (!col.length) continue;

    let guard = -1;                                   // いちばん上の固定ブロック
    for (let i = 0; i < col.length; i++) if (col[i].tier > 0) guard = i;

    const height = i => { let h = 0; for (let k = 0; k < i; k++) h += col[k].n; return h; };
    let cut = -1;
    // 守られていない未固定ブロック（上から下へ／低いほうが優先されるので最終値が残る）
    for (let i = col.length - 1; i > guard; i--){
      if (Math.random() < mag * (0.16 + height(i) * 0.013)) cut = i;
    }
    // 固定ブロックの破損。いちばん下で壊れたところが効く。
    for (let i = guard; i >= 0; i--){
      if (col[i].tier > 0 && Math.random() < mag * TIER[col[i].tier].quake) cut = i;
    }

    /* のぼりみちの すぐ となりの柱で、「下は グラグラ・上は 固定」に なった場合。
       のぼれる高さは 地面から とぎれず 固定されている ぶんだけ なので、
       この柱は そのままでは いくら 積んでも 役に立たない。
       つみ直せるよう、ゆれが 来たら まっさきに 崩れるようにする。 */
    if (isWallCol(c)){
      for (let i = guard; i >= 0; i--){
        if (col[i].tier === 0 && Math.random() < clamp(0.55 + mag * 0.3, 0, 0.95)){
          cut = i; deadWall = true;
        }
      }
    }

    if (cut >= 0){
      let hh = 0;
      for (let i = 0; i < cut; i++) hh += col[i].n;
      const removed = col.splice(cut);
      for (const b of removed){
        addDebris(c, hh, b.n, b.tier);
        hh += b.n;
        fell++;
      }
    }
  }
  if (fell > 0){
    Sfx.collapse();
    state.fx.flash = 0.5;
    state.stats.fallen += fell;
    flashMsg(deadWall ? 'グラグラの かべが くずれた！'
           : fell >= 5   ? 'ガラガラ… おおくずれ！'
           :               'ガラガラ…', 1.8);
  }
  applyLocks(false);          // 支えを失った固定は解除される
  checkHeroSupport();
}

/* ============================ 7. Hero ============================
   主人公は左右の壁にはさまれた「脱出シャフト」に居る。
   地上では棒を上へ投げて壁を築き、両側の壁が固まったら
   左右の壁を交互に蹴って（三角飛びで）シャフトを上がっていく。
   ================================================================ */

/** 柱 c の高さ y の位置に「固定済みの」ブロックがあるか（＝掴める壁か） */
function lockedAt(c, y){
  if (c < 0 || c >= CONFIG.COLS) return false;
  let h = 0;
  for (const b of state.cols[c]){
    if (y >= h && y < h + b.n) return b.tier > 0 && !b.spawn;
    h += b.n;
  }
  return false;
}

/** 主人公の描画X（地上ならシャフト中央、登攀中なら張り付いている壁ぎわ） */
function heroBaseX(col, side, h){
  const cx = colX(col) + CONFIG.COL_W/2;
  return h > 0 ? cx + side * (CONFIG.COL_W/2 - 10) : cx;
}

/** 三角飛び1回。壁は左右交互にしか蹴れない。 */
function heroJump(p){
  const hr = p.hero;
  if (hr.anim) return false;
  const nh = hr.h + CONFIG.JUMP_H;
  if (nh > CONFIG.MAX_STACK) return false;
  const sides = hr.h === 0 ? [-1, 1] : [-hr.side];   // 最初の一歩だけ左右どちらでも
  for (const s of sides){
    if (!lockedAt(hr.col + s, nh - 0.5)) continue;
    hr.anim = { fromCol: hr.col, fromH: hr.h, fromSide: hr.side, t: 0, dur: CONFIG.JUMP_TIME };
    // 壁を 蹴った 足もとで こなが とぶ
    const kx = heroBaseX(hr.col, hr.side, hr.h);
    for (let i = 0; i < 5; i++) addSpark(kx, hr.h);
    hr.h = nh; hr.side = s;
    Sfx.jump();
    return true;
  }
  return false;
}

/* 主人公の左右移動は なくした。
   のぼりみち（シャフト）は 最初から最後まで 動かない。
   動かせても得がなく、操作が増えるだけだったため。 */

/** その柱で、地面から とぎれずに 固定されている 高さ。
    グラグラの石が ひとつでも まざっていたら そこで おしまい。 */
function lockedRun(c){
  if (c < 0 || c >= CONFIG.COLS) return 0;
  let h = 0;
  for (const b of state.cols[c]){
    if (b.tier === 0 || b.spawn > 0) break;
    h += b.n;
  }
  return h;
}

/* 主人公は 壁を「よじ登る」ことは できない。
   よじ登れるなら、石を積まずに 壁を のぼって にげられてしまう。
   できるのは 左右の壁を 交互に 蹴って 跳ぶことだけ。
   だから 左右 どちらの壁も でぐちまで 届いて はじめて のぼれる。 */
function climbableHeight(p){
  const c = p.hero.col;
  return Math.min(lockedRun(c - 1), lockedRun(c + 1));
}

/** 地震のあと、掴んでいた壁が消えていないか。消えていたら下へずり落ちる。 */
function checkHeroSupport(){
  for (const p of state.players){
    const hr = p.hero;
    if (hr.h <= 0) continue;
    if (lockedAt(hr.col + hr.side, hr.h - 0.5)) continue;
    let h = hr.h - CONFIG.JUMP_H, s = -hr.side;
    while (h > 0 && !lockedAt(hr.col + s, h - 0.5)){ h -= CONFIG.JUMP_H; s = -s; }
    h = Math.max(0, h);
    const drop = hr.h - h;
    hr.h = h; hr.side = h === 0 ? 0 : s; hr.anim = null;
    Sfx.fail();
    flashMsg('かべが くずれた！');
    if (drop > CONFIG.FALL_DEATH) gameOver('かべが くずれて おっこちた…');
  }
}

/* 左右の壁が でぐちまで つながると「のぼる！」ボタンが 出る。
   おすたびに 三段跳びが 一歩ずつ すすむ。自動では のぼらない。 */
/* ボタンは 1回 おすだけ。あとは ピョンピョンと でぐちまで 上がっていく。 */
function climbTap(p){
  if (state.phase !== 'play' || p.done) { Sfx.deny(); return; }
  if (!p.ready) { Sfx.deny(); flashMsg('みぎと ひだりの かべが まだ とどいてない！'); return; }
  if (p.running) return;                         // もう のぼっている
  p.running = true; p.hero.restT = 0;
  if (!heroJump(p)) { p.running = false; Sfx.deny(); flashMsg('かべが きえている！'); }
}

/** のぼっている あいだ。1歩 とぶたびに ひと呼吸おいて つぎの1歩へ。 */
function stepClimb(p, dt){
  const hr = p.hero;
  if (hr.anim || p.done) return;
  hr.restT -= dt;
  if (hr.restT > 0) return;
  if (!heroJump(p)){                             // ゆれで 足場が きえた
    p.running = false;
    Sfx.deny(); flashMsg('かべが くずれて とまった！');
  }
}

function updateHero(dt){
  for (const p of state.players){
    const hr = p.hero;
    if (hr.throwT > 0) hr.throwT = Math.max(0, hr.throwT - dt);
    if (hr.swingT   > 0) hr.swingT   = Math.max(0, hr.swingT   - dt);
    if (hr.castT  > 0) hr.castT  = Math.max(0, hr.castT  - dt);

    /* 左右の壁が出口までつながったら「のぼる！」ボタンを 出す。 */
    if (state.phase === 'play' && !p.done){
      const ready = climbableHeight(p) >= CONFIG.GOAL_HEIGHT;
      if (ready && !p.ready){
        p.ready = true;
        Sfx.lock(TIER_MAX);
        flashMsg('みぎと ひだりの かべが とどいた！「のぼる！」を おせ！', 2.4);
      } else if (!ready && p.ready && p.hero.h === 0){
        p.ready = false;                          // のぼる前に かべが きえたら 消す
      }
    }

    if (hr.anim){
      hr.anim.t += dt;
      if (hr.anim.t >= hr.anim.dur){ hr.anim = null; hr.restT = CONFIG.JUMP_REST; }
    } else if (state.phase === 'play' && p.running){
      stepClimb(p, dt);
    }
    if (hr.h >= CONFIG.GOAL_HEIGHT) p.done = true;
  }
  if (state.phase === 'play' && state.players.every(p => p.done)) doClear();
}

function heroScreenPos(p){
  const hr = p.hero;
  if (!hr.anim) return { x: heroBaseX(hr.col, hr.side, hr.h), y: screenY(hr.h), arc: 0 };
  /* 三段跳び。手で つかまって よじ登るのではなく、
     壁を あしで 蹴った 勢いで 一気に とぶ。
     ＝ 蹴った 直後が いちばん速く、あがるほど ゆっくりになる。 */
  const k = clamp(hr.anim.t / hr.anim.dur, 0, 1);
  const e = 1 - Math.pow(1 - k, 1.8);
  const x0 = heroBaseX(hr.anim.fromCol, hr.anim.fromSide, hr.anim.fromH);
  const x1 = heroBaseX(hr.col, hr.side, hr.h);
  const h  = hr.anim.fromH + (hr.h - hr.anim.fromH) * e;
  return { x: x0 + (x1 - x0) * e,
           y: screenY(h) - Math.sin(k * Math.PI) * 26,   // 大きく はずむ
           arc: k };
}

/* ============================ エフェクト ============================ */
/* 崩れる棒は いきなり飛ばさず、まず 足もとを軸に 左右どちらかへ バタンと倒れ、
   倒れきってから 重力で 下へ落ちていく。 */
function addDebris(c, h, n, tier){
  state.fx.debris.push({
    px: colX(c) + CONFIG.COL_W/2,          // 足もと（回る軸）
    py: screenY(h),
    n, tier,
    side: Math.random() < 0.5 ? -1 : 1,    // 倒れる向き
    t: 0, tip: 0.30 + Math.random() * 0.14, // 倒れきるまでの時間
    dx: 0, dy: 0, vy: 0, spin: 0, life: 2.6,
  });
}
function addSpark(x, h){
  const y = screenY(h);
  state.fx.sparks.push({
    x: x + (Math.random()-0.5)*40, y: y + (Math.random()-0.5)*40,
    vx: (Math.random()-0.5)*170, vy: (Math.random()-0.5)*170 - 40,
    life: 0.5 + Math.random()*0.4, max: 0.9,
  });
}
function addText(x, h, txt, color){
  state.fx.texts.push({ x, y: screenY(h), txt, color, life: 1.7, max: 1.7 });
}
function flashMsg(txt, life = 1.1){ state.msg = { txt, life, max: life }; }

function updateFx(dt){
  const f = state.fx;
  for (const d of f.debris){
    d.t += dt;
    if (d.t >= d.tip){                     // 倒れきったら 落ちはじめる
      d.vy  += 1500 * dt;
      d.dy  += d.vy * dt;
      d.dx  += d.side * 26 * dt;
      d.spin += d.side * 2.4 * dt;
      d.life -= dt;
    }
  }
  f.debris = f.debris.filter(d => d.life > 0 && d.py + d.dy < H + 160);
  for (const s of f.sparks){ s.vy += 260*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt; }
  f.sparks = f.sparks.filter(s => s.life > 0);
  for (const t of f.texts){ t.y -= 26 * dt; t.life -= dt; }
  f.texts = f.texts.filter(t => t.life > 0);
  for (const d of f.drops){ d.t += dt; d.glow = Math.max(0, d.glow - dt * 3); }
  f.drops = f.drops.filter(d => d.t < d.dur);
  f.flash = Math.max(0, f.flash - dt * 1.6);
  if (state.msg){ state.msg.life -= dt; if (state.msg.life <= 0) state.msg = null; }

  // 揺れ
  const q = state.quake;
  let amp = 0;
  if (q.mode === 'warn')  amp = 1.6 * q.mag * (1 - q.t / QUAKE_KIND[q.kind].warn);
  if (q.mode === 'shake') amp = 9 * q.mag * clamp(q.shake / q.shakeMax, 0, 1);
  // ふだんのいびき（ゆれ1）。何も壊れないが、魔宮はいつもかすかに揺れている。
  const amb = Math.sin(state.time * 1.7) * 0.6;
  f.shakeX = (Math.random()-0.5) * amp * 2 + amb;
  f.shakeY = (Math.random()-0.5) * amp * 1.2 + Math.sin(state.time * 0.9) * 0.4;
}

/* ============================ 8. Render ============================ */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let DPR = 1;

/* 未固定ブロックの色（数字ごとに少しだけ色相を変える） */
function looseColors(n){
  const hue = 200 + (n - 5) * 9;
  return [`hsl(${hue} 26% 52%)`, `hsl(${hue} 30% 34%)`, `hsl(${hue} 22% 66%)`];
}

function drawBlock(x, y, w, h, n, tier, alpha, wob){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x + wob, y);

  let top, bot, edge, ink;
  if (tier === TIER_MAX){                            // 完全固定はゆっくり光がめぐる
    const hue = (state.time * 55) % 360;
    top  = `hsl(${hue} 95% 82%)`;
    bot  = `hsl(${(hue + 45) % 360} 80% 60%)`;
    edge = '#ffffff'; ink = TIER[TIER_MAX].ink;
  } else if (tier > 0){
    ({ top, bot, edge, ink } = TIER[tier]);
  } else {
    [top, bot, edge] = looseColors(n); ink = 'rgba(255,255,255,.92)';
  }

  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, bot); g.addColorStop(0.35, top); g.addColorStop(1, bot);
  ctx.fillStyle = g;
  roundRect(0, 0, w, h, 4); ctx.fill();

  // 数字ぶんの目盛り（1=■ / 3=■■■ が見た目で分かるように）
  const u = h / n;
  ctx.strokeStyle = tier > 0 ? 'rgba(40,20,0,.32)' : 'rgba(0,0,0,.30)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < n; i++){ ctx.moveTo(3, i*u); ctx.lineTo(w-3, i*u); }
  ctx.stroke();

  ctx.strokeStyle = edge; ctx.lineWidth = tier > 0 ? 1.4 + tier * 0.4 : 1.4;
  roundRect(0.8, 0.8, w-1.6, h-1.6, 4); ctx.stroke();

  // 数字
  ctx.fillStyle = ink;
  ctx.font = `700 ${Math.min(26, Math.max(15, w*0.42))}px "Segoe UI",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), w/2, h/2);

  ctx.restore();
}
/* 西洋の古い城の まど。先のとがった アーチ（ゴシック）の かたち。
   x,y = 左上 / w,h = はば と たかさ。下端が y+h。 */
function gothicPath(x, y, w, h){
  const spring = y + h * 0.42;          // アーチが立ちあがる高さ
  const cx = x + w/2;
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, spring);
  ctx.quadraticCurveTo(x + w * 0.05, y + h * 0.04, cx, y);
  ctx.quadraticCurveTo(x + w * 0.95, y + h * 0.04, x + w, spring);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
}

function roundRect(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

/** 魔宮の かべの石。プレイヤーの石とは ちがう すみれ色。 */
function drawWallStone(x, y, w, h, n){
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#2a2044'); g.addColorStop(0.35, '#4b3c74'); g.addColorStop(1, '#2a2044');
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1;
  ctx.beginPath();
  const u = h / n;
  for (let i = 1; i < n; i++){ ctx.moveTo(x + 2, y + i*u); ctx.lineTo(x + w - 2, y + i*u); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(146,124,200,.45)'; ctx.lineWidth = 1.2;
  roundRect(x + 0.6, y + 0.6, w - 1.2, h - 1.2, 3); ctx.stroke();
  ctx.fillStyle = 'rgba(197,180,240,.42)';
  ctx.font = `700 ${Math.min(18, Math.max(12, w * 0.56))}px "Segoe UI",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), x + w/2, y + h/2);
}

/* ---- 背景：魔宮と眠れる大魔王 ---- */

/** 大魔王の姿勢（寝返りの左右反転とジャンプ）。鼻提灯の描画とも共有する。 */
/* 大魔王は 床で横になって眠っている（もとの位置）。
   その頭から 夢の吹き出しが のぼり、画面上の雲になる。 */
function demonPose(){
  const dm = state.demon, u = dm.rollU;
  const breathe = Math.sin(state.time * 0.9) * 0.5 + 0.5;
  const bodyTop = -150 - breathe * 14;
  return {
    breathe, bodyTop,
    hx: 175, hy: bodyTop + 30 - breathe * 6,
    sx:  u > 0 ? dm.flip * Math.cos(u * Math.PI) : dm.flip,
    hop: u > 0 ? -Math.sin(u * Math.PI) * 16 : 0,
    gy:  screenY(0),
  };
}
/** 危険度 0〜1。ゆれが近づくほど 1 に近づく。背景を赤くするのに使う。
    はじめは ゆっくり、直前で一気に赤くなるよう2乗でためている。 */
function dangerLevel(){
  const q = state.quake;
  if (q.mode === 'shake') return clamp(q.shake / q.shakeMax, 0, 1);
  const k = clamp(1 - q.t / CONFIG.DANGER_LEAD, 0, 1);
  return k * k;
}

/** ふくらみ具合 0〜1。パチンの予兆でどんどん大きくなる。 */
function bubbleGrow(){
  const q = state.quake;
  if (q.kind !== 'pop' || q.mode === 'idle') return 0;
  if (q.mode === 'shake') return 0;                       // もうはじけた
  return clamp(1 - q.t / QUAKE_KIND.pop.warn, 0, 1);
}

/* 画面いちばん上の 大魔王。何百年も眠りつづけている。
   顔は下向きで、頭のまわりから 夢が生まれてくる。 */
function drawDemon(){
  const q = state.quake;
  const p = demonPose();
  const { breathe, bodyTop, hx, hy, gy } = p;
  const snoring = q.mode === 'warn' ? 1 - q.t / QUAKE_KIND[q.kind].warn
                : (q.mode === 'shake' ? 1 : 0);
  const big = q.kind === 'roll' ? 0.4 : 1;
  if (gy < FIELD_TOP - 260) return;

  ctx.save();
  ctx.translate(W/2, gy + p.hop);
  ctx.scale(p.sx, 1);
  ctx.translate(-W/2, 0);
  ctx.globalAlpha = 0.85;                       // 背景に埋もれないよう はっきり出す

  const skin = 'rgba(78,49,112,0.96)';
  const rim  = 'rgba(158,118,216,0.55)';        // ふちの あかり（形が読めるように）
  ctx.lineJoin = 'round';

  // 体（横たわる大きなからだ）
  ctx.fillStyle = skin; ctx.strokeStyle = rim; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-40, 90);
  ctx.bezierCurveTo(120, bodyTop + 40, 300, bodyTop, 470, bodyTop + 30);
  ctx.bezierCurveTo(620, bodyTop + 60, 700, 20, 730, 90);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  /* 角は「6」、耳は「3」の かたち。かずの まじん なので 体まで かず。
     寝返りで 体が左右反転しても 数字だけは 読める向きに もどす。 */
  const dfix = p.sx < 0 ? -1 : 1;
  const glyph = (ch, gx, gy, size, rot, mirror) => {
    ctx.save();
    ctx.translate(gx, gy);
    ctx.scale(dfix * (mirror ? -1 : 1), 1);
    ctx.rotate(rot);
    ctx.font = `700 ${size}px "Segoe UI","Yu Gothic UI",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0);
    ctx.lineWidth = 3; ctx.strokeText(ch, 0, 0);
    ctx.restore();
  };
  // 耳＝3（頭の左右。左右とも 3 は 正しい向きのまま）
  glyph('3', hx - 96, hy + 44, 58, 0, false);
  glyph('3', hx + 96, hy + 44, 58, 0, false);
  // 角＝6（頭の上へ 伸びる。左右とも 6 は 正しい向きのまま）
  glyph('6', hx - 62, hy - 30, 84, -0.42, false);
  glyph('6', hx + 60, hy - 34, 84,  0.42, false);

  // 頭（角より手前。すこし明るくして 顔が浮き出るように）
  const hg = ctx.createRadialGradient(hx - 30, hy + 20, 10, hx, hy + 46, 110);
  hg.addColorStop(0, 'rgba(102,66,146,0.97)');
  hg.addColorStop(1, 'rgba(70,43,101,0.97)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(hx, hy + 46, 96, 66, -0.12, 0, 7); ctx.fill(); ctx.stroke();

  // 目：ぐっすり眠っているので、いつでも閉じたまま
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#160b22'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const ex of [hx - 40, hx + 32]){
    ctx.beginPath();
    ctx.moveTo(ex - 17, hy + 34);
    ctx.quadraticCurveTo(ex, hy + 44, ex + 17, hy + 34);
    ctx.stroke();
  }
  // 鼻
  ctx.fillStyle = 'rgba(124,82,172,.95)';
  ctx.beginPath(); ctx.ellipse(hx + 16, hy + 56, 18, 13, -0.2, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(20,10,32,.95)';
  ctx.beginPath(); ctx.ellipse(hx + 25, hy + 60, 5, 4, -0.2, 0, 7); ctx.fill();
  // 口（いびきをかくと大きく開く）
  ctx.beginPath();
  ctx.ellipse(hx + 4, hy + 82, 30, 5 + breathe * 8 + snoring * 30 * big, 0, 0, 7);
  ctx.fillStyle = 'rgba(14,7,24,.95)'; ctx.fill();
  ctx.strokeStyle = 'rgba(158,118,216,.4)'; ctx.lineWidth = 2; ctx.stroke();

  // いびきの Z
  // 寝返りで 体ごと左右反転しているので、文字だけ もう一度反転して
  // 鏡文字にならないようにする。
  const zfix = p.sx < 0 ? -1 : 1;
  ctx.fillStyle = '#b6a6d8'; ctx.textAlign = 'center';
  for (let i = 0; i < 3; i++){
    const t = ((state.time * 0.34) + i * 0.33) % 1;
    ctx.globalAlpha = 0.5 * (1 - t);
    ctx.font = `700 ${14 + t * 18}px "Segoe UI",sans-serif`;
    ctx.save();
    ctx.translate(hx + 60 + t * 60, hy + 62 - t * 110);
    ctx.scale(zfix, 1);
    ctx.fillText('Z', 0, 0);
    ctx.restore();
  }

  /* 夢の吹き出しの しっぽ。頭から 上の雲へ 小さな丸がのぼっていく。 */
  ctx.globalAlpha = 1;
  const tailTop = FIELD_TOP - gy;                 // 雲の下端（この座標系での）
  for (let i = 0; i < 5; i++){
    const k = (i + 1) / 6;
    const bx = hx + 34 + k * 46 + Math.sin(state.time * 1.1 + i) * 5;
    const by = (hy - 30) + (tailTop - (hy - 30)) * k;
    ctx.globalAlpha = 0.30 + k * 0.22;
    ctx.fillStyle = '#b9c9ff';
    ctx.beginPath(); ctx.arc(bx, by, 3 + k * 7, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawBackground(){
  // 奥の壁
  const g = ctx.createLinearGradient(0, 0, 0, FIELD_H);
  g.addColorStop(0, '#100c1c'); g.addColorStop(0.6, '#1c1530'); g.addColorStop(1, '#241a3c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, FIELD_H);

  /* 石壁（左右）＝ 魔宮そのものも かずの石で できている。
     プレイヤーの石（青灰・銀・金・にじ）とは ちがう すみれ色の石にして、
     さわれない かべ だと 見分けられるようにする。 */
  ctx.fillStyle = '#161024';
  ctx.fillRect(0, 0, FIELD_X, FIELD_H);
  ctx.fillRect(FIELD_X + FIELD_W, 0, W - FIELD_X - FIELD_W, FIELD_H);
  for (const col of WALLS){
    for (const s of col.stack){
      const y = screenY(s.h + s.n), bh = s.n * CONFIG.UNIT;
      if (y > FIELD_H || y + bh < FIELD_TOP) continue;
      drawWallStone(col.x, y, col.w, bh, s.n);
    }
  }
  // おくゆき（かべの内がわを 少し暗く落とす）
  const shd = ctx.createLinearGradient(FIELD_X - 26, 0, FIELD_X, 0);
  shd.addColorStop(0, 'rgba(0,0,0,0)'); shd.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = shd; ctx.fillRect(FIELD_X - 26, 0, 26, FIELD_H);
  const shd2 = ctx.createLinearGradient(FIELD_X + FIELD_W + 26, 0, FIELD_X + FIELD_W, 0);
  shd2.addColorStop(0, 'rgba(0,0,0,0)'); shd2.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = shd2; ctx.fillRect(FIELD_X + FIELD_W, 0, 26, FIELD_H);

  // 柱のガイド
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  for (let c = 0; c <= CONFIG.COLS; c++){
    const x = colX(c) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, FIELD_TOP); ctx.lineTo(x, Math.min(FIELD_H, screenY(0))); ctx.stroke();
  }

  // 高さの目盛り（10ごと）
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.font = '11.5px "Segoe UI",sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let h = 10; h <= CONFIG.GOAL_HEIGHT; h += 10){
    const y = screenY(h);
    if (y < FIELD_TOP || y > FIELD_H) continue;
    ctx.strokeStyle = 'rgba(255,255,255,.06)';
    ctx.beginPath(); ctx.moveTo(FIELD_X, y); ctx.lineTo(FIELD_X + FIELD_W, y); ctx.stroke();
    ctx.fillText(String(h), FIELD_X - 6, y);
  }

  // 地面
  const gy = screenY(0);
  if (gy < FIELD_H + 40){
    ctx.fillStyle = '#0d0916';
    ctx.fillRect(0, gy, W, FIELD_H - gy + 40);
    ctx.strokeStyle = '#4b3a72'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  /* 出口＝魔宮の まど。
     ここから 外へ 逃げ出すので、まどの ふち・わく・格子まで きちんと描く。
     まどの さんが ちょうど「のぼりきる高さ」の線になる。 */
  const ey = screenY(CONFIG.GOAL_HEIGHT);
  if (ey > FIELD_TOP - 130 && ey < FIELD_H + 60){
    // まどの高さは 上に残っている場所に合わせる（見切れないように）
    const ww = 168, wh = clamp(ey - FIELD_TOP - 10, 46, 92);
    const wx = W/2 - ww/2, wy = ey - wh;           // さんの上に まどが立つ
    const puls = 0.16 + Math.sin(state.time*2)*0.05;

    // まどから 下へ こぼれる光
    const grd = ctx.createLinearGradient(0, ey - 8, 0, ey + 84);
    grd.addColorStop(0, `rgba(255,236,160,${0.30 + puls})`);
    grd.addColorStop(1, 'rgba(255,236,160,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(wx + 6, ey); ctx.lineTo(wx + ww - 6, ey);
    ctx.lineTo(wx + ww + 54, ey + 88); ctx.lineTo(wx - 54, ey + 88);
    ctx.closePath(); ctx.fill();

    // まわりの 石づくりの かべ
    ctx.fillStyle = '#231a3c';
    ctx.fillRect(wx - 30, wy - 12, ww + 60, wh + 14);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    for (let y2 = wy - 4; y2 < ey; y2 += 15){
      ctx.beginPath(); ctx.moveTo(wx - 30, y2); ctx.lineTo(wx - 8, y2);
      ctx.moveTo(wx + ww + 8, y2); ctx.lineTo(wx + ww + 30, y2); ctx.stroke();
    }

    // まわりの ぼんやりした あかり
    ctx.save();
    ctx.globalAlpha = 0.35 + puls;
    ctx.shadowColor = '#ffe58a'; ctx.shadowBlur = 28;
    ctx.strokeStyle = '#ffe58a'; ctx.lineWidth = 2;
    gothicPath(wx, wy, ww, wh); ctx.stroke();
    ctx.restore();

    // まどの 外（あかるい空）
    const sky = ctx.createLinearGradient(0, wy, 0, ey);
    sky.addColorStop(0, '#fffbe6'); sky.addColorStop(1, '#ffd766');
    ctx.fillStyle = sky;
    gothicPath(wx, wy, ww, wh); ctx.fill();

    // 石の わく（外がわ太く・内がわ細く 明るい線）
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = '#4b3a72'; ctx.lineWidth = 11;
    gothicPath(wx, wy, ww, wh); ctx.stroke();
    ctx.strokeStyle = '#9d8ad2'; ctx.lineWidth = 3.5;
    gothicPath(wx, wy, ww, wh); ctx.stroke();

    // 中の こまかい わく（ゴシックらしい たて長の２つ窓）
    const spring = wy + wh * 0.42;
    if (wh >= 62){
      const iw = ww/2 - 16;
      ctx.strokeStyle = '#5f4d8f'; ctx.lineWidth = 6;
      gothicPath(wx + 10, spring - 6, iw, ey - (spring - 6) - 8); ctx.stroke();
      gothicPath(W/2 + 6, spring - 6, iw, ey - (spring - 6) - 8); ctx.stroke();
      // てっぺんの まる窓
      ctx.beginPath(); ctx.arc(W/2, wy + wh * 0.20, wh * 0.09, 0, 7);
      ctx.strokeStyle = '#5f4d8f'; ctx.lineWidth = 5; ctx.stroke();
    }
    // まん中の 柱
    ctx.strokeStyle = '#4b3a72'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(W/2, spring - 2); ctx.lineTo(W/2, ey - 2); ctx.stroke();

    // アーチの かなめ石 と 受け石
    ctx.fillStyle = '#6a5a92';
    ctx.beginPath();
    ctx.moveTo(W/2 - 9, wy + 2); ctx.lineTo(W/2 + 9, wy + 2);
    ctx.lineTo(W/2 + 6, wy + 16); ctx.lineTo(W/2 - 6, wy + 16);
    ctx.closePath(); ctx.fill();
    for (const sx of [wx - 9, wx + ww - 5]){
      ctx.fillStyle = '#6a5a92';
      roundRect(sx, spring - 5, 14, 9, 2); ctx.fill();
    }

    // まどの さん（ここに 立って 外へ出る）
    ctx.fillStyle = '#4b3a72';
    roundRect(wx - 20, ey - 3, ww + 40, 12, 3); ctx.fill();
    ctx.fillStyle = '#9d8ad2';
    roundRect(wx - 20, ey - 3, ww + 40, 3.5, 2); ctx.fill();

    // 高さの めじるしとして 左右へ のびる線
    ctx.strokeStyle = 'rgba(255,229,138,.55)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, ey + 2); ctx.lineTo(wx - 18, ey + 2);
    ctx.moveTo(wx + ww + 18, ey + 2); ctx.lineTo(W, ey + 2);
    ctx.stroke();

    ctx.fillStyle = '#ffe58a';
    ctx.font = '700 18px "Segoe UI","Yu Gothic UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('で　ぐ　ち', W/2, wy - 8);
  }

  /* ゆれが近づくと、床（大魔王のいるほう）から赤がせり上がってくる。
     棒の色は変えずに背景だけを染めるので、かたさの色分けが読めなくならない。 */
  const dg = dangerLevel();
  if (dg > 0.01){
    const roll = state.quake.kind === 'roll';
    const rgb = roll ? '255,46,96' : '255,84,34';           // ねがえりは より赤い
    const pulse = 1 + Math.sin(state.time * 9) * 0.12 * dg;
    const top = FIELD_H - (150 + 420 * dg);
    const rg = ctx.createLinearGradient(0, FIELD_H, 0, top);
    rg.addColorStop(0,    `rgba(${rgb},${(0.50 * dg * pulse).toFixed(3)})`);
    rg.addColorStop(0.55, `rgba(${rgb},${(0.20 * dg * pulse).toFixed(3)})`);
    rg.addColorStop(1,    `rgba(${rgb},0)`);
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, FIELD_H);
    // 画面のふちも うっすら赤く
    const vg = ctx.createRadialGradient(W/2, FIELD_H*0.55, W*0.22, W/2, FIELD_H*0.55, W*0.78);
    vg.addColorStop(0, `rgba(${rgb},0)`);
    vg.addColorStop(1, `rgba(${rgb},${(0.34 * dg).toFixed(3)})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, FIELD_H);
  }
}

/* 柱は「段のつみ重ね」として描く。
   各段は自分の付け根で少しだけ回転し、その回転が上の段へそのまま伝わる。
   だから1段あたりの角度は小さくても、高い柱ほど てっぺんが大きくずれる。
   固定されたブロックほど傾かず、むてきはまったく傾かない。 */
function drawTower(){
  const q = state.quake;
  const shakeAmp = q.mode === 'shake' ? 3.5 * q.mag : (q.mode === 'warn' ? 0.9 : 0);
  /* いびき1回ごとの ゆらぎ。すっと 立ちあがって ゆっくり おさまる。 */
  const sw = state.snoreW || 0;
  const snoreW = Math.sin(Math.min(1, (1 - sw) * 8) * Math.PI / 2) * sw;
  for (let c = 0; c < CONFIG.COLS; c++){
    const col = state.cols[c];
    if (!col.length) continue;

    ctx.save();
    ctx.translate(colX(c) + CONFIG.COL_W/2, screenY(0));   // 柱の足もと
    let h = 0;
    for (const b of col){
      const bh = b.n * CONFIG.UNIT;
      // ゆれは下から上へ伝わっていくので、高い段ほど位相を遅らせる
      const wave = Math.sin(state.time * 6.5 - h * 0.05 + c * 0.6 + b.ph * 0.2);
      let ang = 0;
      if (b.tier === 0){
        // ふだんの いびきでも、固まっていない石は ひとゆれ する
        ang = (CONFIG.TILT_LOOSE + shakeAmp * CONFIG.TILT_SHAKE
               + snoreW * CONFIG.TILT_SNORE) * wave;
      } else if (b.tier < TIER_MAX && shakeAmp > 0){
        ang = shakeAmp * CONFIG.TILT_SHAKE * ((TIER_MAX - b.tier) / TIER_MAX) * 0.5 * wave;
      }
      ctx.rotate(ang);

      if (b.spawn === 0){                          // 飛んでいる最中は描かない
        const sy = screenY(h + b.n);
        if (sy < FIELD_H + 80 && sy + bh > -80){
          drawBlock(-BLK_W/2, -bh, BLK_W, bh, b.n, b.tier, 1, 0);
          if (b.flash > 0){
            ctx.save();
            ctx.globalAlpha = b.flash * 0.85;
            ctx.strokeStyle = TIER[b.tier] ? TIER[b.tier].edge : '#fff8dc';
            ctx.lineWidth = 3 + b.flash * (3 + b.tier * 2);
            roundRect(-BLK_W/2, -bh, BLK_W, bh, 4); ctx.stroke();
            ctx.restore();
            b.flash = Math.max(0, b.flash - 0.045);
          }
        }
      }
      ctx.translate(0, -bh);                       // つぎの段の足もとへ
      h += b.n;
    }
    ctx.restore();
  }
}

function drawGhost(p){
  if (!p.held) return;
  const c = p.cursor, n = p.held.n;
  const base = colH(c);
  const ok = canPlace(p, c);
  // むずかしいモードでは予測しない → 以下すべて「未固定」の見た目になる
  const tier = (ok && !state.hard) ? wouldLock(c, n) : 0;
  const lock = tier > 0;
  const tcol = lock ? TIER[tier].top : '#7bffc0';
  const y = screenY(base + n);
  const bh = n * CONFIG.UNIT;
  const x = colX(c) + BLK_OFF, w = BLK_W;

  // ねらっている柱を縦いっぱいに光らせる（＝どこを触っても置ける範囲）
  ctx.save();
  ctx.fillStyle = ok ? (lock ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.07)')
                     : 'rgba(255,90,90,.10)';
  ctx.fillRect(colX(c), FIELD_TOP, CONFIG.COL_W, LANE_Y - FIELD_TOP);
  ctx.restore();

  // 落下ガイド（夢石レーンから 落ちる先まで）
  ctx.save();
  ctx.strokeStyle = ok ? (lock ? tcol : 'rgba(255,255,255,.22)') : 'rgba(255,90,90,.45)';
  ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(colX(c)+CONFIG.COL_W/2, DREAM_MID); ctx.lineTo(colX(c)+CONFIG.COL_W/2, y);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.45;
  drawBlock(x, y, w, bh, n, tier, 1, 0);
  ctx.restore();

  ctx.save();
  ctx.setLineDash(lock ? [] : [6, 4]);
  ctx.lineWidth = lock ? 3 : 2;
  ctx.strokeStyle = ok ? (lock ? tcol : 'rgba(255,255,255,.7)') : '#ff6a6a';
  roundRect(x, y, w, bh, 4); ctx.stroke();
  ctx.restore();

  if (lock){
    ctx.fillStyle = tcol;
    ctx.font = '700 15px "Segoe UI","Yu Gothic UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('カチン！ ' + TIER[tier].name, x + w/2, y - 6);
  }
  if (!ok){
    ctx.fillStyle = '#ff6a6a';
    ctx.font = '700 17px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('×', x + w/2, y - 4);
  }

}

/* 鼻提灯。ふだんは呼吸に合わせて小さくふくらんだり縮んだり。
   パチンの予兆でぐんぐん大きくなり、はじけた瞬間に破片が散る。
   建物より手前に描いて、来ることが必ず見えるようにする。 */
function drawBubble(){
  const dm = state.demon, p = demonPose();
  if (p.gy < FIELD_TOP - 260) return;
  const grow = bubbleGrow();
  /* 1回目・2回目は 大きめに ふくらませる。
     はじめて遊ぶ子に「これが ふくらみきると パチンと来る」ことを
     見のがしようのない 大きさで 教えるため。3回目からは ふつうの大きさ。 */
  const first = state.quake.count === 0 ? 1.60
              : state.quake.count === 1 ? 1.35 : 1;
  // まっすぐ大きくなる。2乗にすると 最後の最後で いきなり ふくらんで見える。
  const r = (7 + p.breathe * 5) + grow * 52 * first;

  ctx.save();
  ctx.translate(W/2, p.gy + p.hop);
  ctx.scale(p.sx, 1);
  ctx.translate(-W/2, 0);

  const nx = p.hx + 27, ny = p.hy + 60;
  const cx = nx + r * 0.55, cy = ny - r * 0.72;

  if (dm.popT > 0){                              // はじけた破片
    const k = 1 - dm.popT / 0.55;
    ctx.globalAlpha = (1 - k) * 0.9;
    ctx.strokeStyle = '#dff2ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 30 + k * 60, 0, 7); ctx.stroke();
    for (let i = 0; i < 8; i++){
      const a = i / 8 * 6.28 + 0.3;
      const d = 26 + k * 74;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 5 * (1 - k), 0, 7);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }

  ctx.globalAlpha = 0.30 + grow * 0.45;
  const g = ctx.createRadialGradient(cx - r*0.35, cy - r*0.4, r*0.1, cx, cy, r);
  g.addColorStop(0,   'rgba(255,255,255,.95)');
  g.addColorStop(0.45,'rgba(200,235,255,.30)');
  g.addColorStop(1,   'rgba(150,205,255,.55)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.94, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(226,244,255,${0.5 + grow * 0.4})`;
  ctx.lineWidth = 1.6; ctx.stroke();
  // ハイライト
  ctx.globalAlpha = (0.4 + grow * 0.5);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(cx - r*0.36, cy - r*0.4, r*0.2, r*0.13, -0.6, 0, 7); ctx.fill();
  ctx.restore();
}

/* 脱出シャフト：主人公のいる柱。ここは空けておき、両側の壁を伝って登る。 */
function drawShaft(){
  for (const pl of state.players) drawOneShaft(pl);
}
function drawOneShaft(pl){
  const c = pl.hero.col, x = colX(c);
  const climb = climbableHeight(pl);
  /* ふたりのときは 自分の色で のぼりみちを 染める。
     いま えらぶ ばんの人は 明るく 脈うつ（文字にたよらず 色と光で しめす）。 */
  const two  = playerCount === 2;
  const mine = two && state.turn === pl.id;
  const puls = mine ? 0.5 + Math.sin(state.time * 4.2) * 0.5 : 0;
  const rgb  = !two ? '130,205,255' : (pl.id === 0 ? '176,142,255' : '106,235,180');
  ctx.save();
  const g = ctx.createLinearGradient(x, 0, x + CONFIG.COL_W, 0);
  const edge = 0.13 + puls * 0.20;
  g.addColorStop(0,  `rgba(${rgb},${edge})`);
  g.addColorStop(0.5,`rgba(${rgb},${0.02 + puls * 0.06})`);
  g.addColorStop(1,  `rgba(${rgb},${edge})`);
  ctx.fillStyle = g; ctx.fillRect(x, 0, CONFIG.COL_W, LANE_Y);
  ctx.strokeStyle = `rgba(${rgb},${0.35 + puls * 0.5})`;
  ctx.lineWidth = mine ? 2.4 : 1.5;
  ctx.setLineDash([7, 7]);
  ctx.beginPath();
  ctx.moveTo(x + 1, 0); ctx.lineTo(x + 1, LANE_Y);
  ctx.moveTo(x + CONFIG.COL_W - 1, 0); ctx.lineTo(x + CONFIG.COL_W - 1, LANE_Y);
  ctx.stroke(); ctx.setLineDash([]);

  // ここまで登れる、という線
  if (climb > 0){
    const y = screenY(climb);
    if (y > 0 && y < LANE_Y){
      ctx.strokeStyle = '#7fe3ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 2, y); ctx.lineTo(x + CONFIG.COL_W - 2, y); ctx.stroke();
      ctx.fillStyle = '#7fe3ff';
      ctx.font = '700 12px "Segoe UI","Yu Gothic UI",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('ここまで', x + CONFIG.COL_W/2, y - 2);
    }
  }
  /* のぼりみちの ふだ。上の雲に かくれないよう 建築ビューの すぐ内側に置く。
     ふたりのときは「1P ひだり」「2P みぎ」で キーの わりあてが 分かる。 */
  const cx = x + CONFIG.COL_W/2, ty = FIELD_TOP + 5;
  ctx.font = '800 12px "Segoe UI","Yu Gothic UI",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  if (two){
    const tw = 34;
    if (mine){ ctx.shadowColor = P_HUE[pl.id]; ctx.shadowBlur = 10 + puls * 12; }
    ctx.fillStyle = `rgba(${rgb},${mine ? 0.55 + puls * 0.4 : 0.20})`;
    roundRect(cx - tw/2, ty, tw, 15, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = mine ? '#12081f' : `rgba(${rgb},.8)`;
    ctx.fillText(pl.id === 0 ? '1P' : '2P', cx, ty + 2);
  } else {
    ctx.fillStyle = 'rgba(150,215,255,.65)';
    ctx.fillText('のぼりみち', cx, ty + 1);
  }
  ctx.restore();
}

/* えらばれた夢石が 重力にしたがって 真下へ落ちていく */
function drawDrops(){
  for (const d of state.fx.drops){
    const y = d.y0 + 0.5 * GRAVITY * d.t * d.t;
    const w = BLK_W, bh = d.n * CONFIG.UNIT;
    // 糸で つっていた ところから 柱の 真上へ すべりこむ
    const s = clamp(d.t / Math.max(0.001, d.dur * 0.5), 0, 1);
    const x = (d.x0 ?? d.x) + (d.x - (d.x0 ?? d.x)) * (s * s * (3 - 2 * s));
    // おちる筋（うっすら光の尾を引く）
    ctx.save();
    const g = ctx.createLinearGradient(0, d.y0, 0, y);
    g.addColorStop(0, 'rgba(180,220,255,0)');
    g.addColorStop(1, 'rgba(190,230,255,.28)');
    ctx.fillStyle = g;
    ctx.fillRect(x - w/4, d.y0, w/2, Math.max(0, y - d.y0));
    ctx.restore();

    ctx.save();
    if (d.glow > 0){ ctx.shadowColor = '#cfe9ff'; ctx.shadowBlur = 22 * d.glow; }
    drawBlock(x - w/2, y - bh, w, bh, d.n, 0, 1, 0);
    ctx.restore();
  }
}

/* つりざおの かたむきと 長さ。さおの先の位置を 出すのにも つかう。 */
const ROD_ANG = 0.78, ROD_LEN = 40;
/* かかった夢石を 下へ ひきおろす量。
   雲の中に のこすと、あとから 流れてくる 石と かさなって
   「数字より 大きい 石」に 見えてしまうので、雲の 下まで ひっぱり出す。 */
const HOOK_TOP = DREAM_Y + DREAM_H + 4;          // ひきおろした 石の 上のはし
const hookPull = n => HOOK_TOP - (DREAM_MID + 2 - n * CONFIG.UNIT / 2);
function rodTip(pl){
  const esc = state.phase === 'escape' ? escPose(pl) : null;
  const p = esc || heroScreenPos(pl);
  const hr = pl.hero;
  const onWall = !esc && (hr.h > 0 || (hr.anim && hr.anim.fromH > 0));
  const face = onWall ? (hr.side || 1) : 1;
  const bob = (onWall || esc) ? 0 : Math.sin(state.time * 3) * 1.6;
  const lx = 7 + Math.sin(ROD_ANG) * ROD_LEN;      // さおの先（主人公から見た位置）
  const ly = -15 - Math.cos(ROD_ANG) * ROD_LEN;
  return { x: p.x + lx * face, y: p.y + bob + ly };
}

/* つり糸。雲（画面の上）と 建築ビューを またぐので、
   どちらのクリップにも 入らないよう いちばん最後に 描く。
   えらぶ → 糸が 上へのびる → 夢石に 引っかかる → 引っぱられて ぶらさがる。
   おとす と 糸が はなれて 石が 落ちていく。 */
function drawFishing(){
  for (const pl of state.players){
    const hr = pl.hero;
    if (!pl.held || !pl.castFrom) continue;
    const tip = rodTip(pl);
    const src = pl.castFrom;
    const k = hr.castT > 0 ? clamp(1 - hr.castT / CAST_DUR, 0, 1) : 1;
    const h = pl.held.n * CONFIG.UNIT, w = BLK_W;

    // 引っかかったら 雲の下へ 引っぱりおろし、ゆらゆら する
    const pull = k < 0.5 ? 0
               : hookPull(pl.held.n) * Math.min(1, (k - 0.5) / 0.25)
                 + Math.sin(state.time * 2.6) * 2;
    const topY = src.y - h/2 + pull;                 // 石の上のはし＝はりの位置

    // 糸の先。まず さおの先から 上へ のびていく
    let ex, ey;
    if (k < 0.5){
      const t = k / 0.5, e = t * t;                  // しゅっと 加速して とどく
      ex = tip.x + (src.x - tip.x) * e;
      ey = tip.y + (topY  - tip.y) * e;
    } else { ex = src.x; ey = topY; }

    ctx.save();
    ctx.strokeStyle = 'rgba(226,240,255,.85)'; ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.quadraticCurveTo((tip.x + ex)/2 + 7, (tip.y + ey)/2 + 10, ex, ey);
    ctx.stroke();
    if (k >= 0.5){
      ctx.strokeStyle = '#e6eefc'; ctx.lineWidth = 2;          // はり
      ctx.beginPath();
      ctx.arc(ex, ey + 4, 3.6, Math.PI * 1.15, Math.PI * 0.15); ctx.stroke();
      ctx.shadowColor = '#dff2ff'; ctx.shadowBlur = 18;
      drawBlock(src.x - w/2, topY, w, h, pl.held.n, 0, 1, 0);  // かかった夢石
    }
    ctx.restore();
  }
}

function drawHero(){
  // ふたりが 手をつなぐ線（逃げ出す演出のあいだ）
  if (state.phase === 'escape' && state.players.length === 2){
    const a = escPose(state.players[0]), b = escPose(state.players[1]);
    if (a.hands){
      ctx.save();
      ctx.globalAlpha = Math.min(a.alpha, b.alpha);
      ctx.strokeStyle = '#ffe0c0'; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x + 5, a.y - 16);
      ctx.quadraticCurveTo((a.x + b.x)/2, a.y - 12, b.x - 5, b.y - 16);
      ctx.stroke();
      ctx.restore();
    }
  }
  for (const pl of state.players) drawOneHero(pl);
}
function drawOneHero(pl){
  const esc = state.phase === 'escape' ? escPose(pl) : null;
  const p = esc || heroScreenPos(pl);
  if (p.y < -160 || p.y > FIELD_H + 50) return;
  const hr = pl.hero;
  const onWall = !esc && (hr.h > 0 || (hr.anim && hr.anim.fromH > 0));
  const face = onWall ? (hr.side || 1) : 1;
  const bob = (onWall || esc) ? 0 : Math.sin(state.time * 3) * 1.6;

  ctx.save();
  if (esc) ctx.globalAlpha = esc.alpha;
  ctx.translate(p.x, p.y + bob);
  if (!onWall && !esc){
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 4, 0, 0, 7); ctx.fill();
  }
  ctx.scale(face, 1);                     // 張り付いている壁のほうを向く
  /* とんでいる あいだ。0〜1 で すすむ（-1 は とんでいない） */
  const air = (!esc && hr.anim) ? clamp(hr.anim.t / hr.anim.dur, 0, 1) : -1;
  const fly = air >= 0 && air < 1;
  const swing = fly ? Math.sin(air * Math.PI) : 0;
  if (fly) ctx.rotate(0.34 * swing);      // 蹴った いきおいで 前のめりに

  /* つりざお と リール。夢石を えらぶと 糸を上へ のばして 引っかける。
     主人公は こちらに 背を向けているので、さおは 右手のあたりに 出す。 */
  if (!esc){
    const sw = hr.swingT > 0 ? Math.sin((1 - hr.swingT / 0.42) * Math.PI) : 0;
    ctx.save();
    ctx.translate(7, -15);
    ctx.rotate(ROD_ANG - sw * 0.28);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 7); ctx.lineTo(0, -ROD_LEN); ctx.stroke();
    ctx.strokeStyle = '#c69a5e'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, -ROD_LEN + 2); ctx.stroke();
    // ガイド（糸を通す わっか）
    ctx.strokeStyle = '#d8dee9'; ctx.lineWidth = 1.2;
    for (const gy of [-16, -27, -ROD_LEN + 2]){
      ctx.beginPath(); ctx.arc(2.5, gy, 2.4, 0, 7); ctx.stroke();
    }
    // リール
    ctx.fillStyle = '#cfd8e8';
    ctx.beginPath(); ctx.arc(-4.5, -2, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#79839a'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#79839a';
    ctx.beginPath(); ctx.arc(-4.5, -2, 1.7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#79839a'; ctx.lineWidth = 1.6;
    const spin = state.time * (hr.castT > 0 ? 11 : 1.2);
    ctx.beginPath();
    ctx.moveTo(-4.5, -2);
    ctx.lineTo(-4.5 + Math.cos(spin) * 6.5, -2 + Math.sin(spin) * 6.5);
    ctx.stroke();
    ctx.restore();
  }

  // 腕：よろこぶときは バンザイ。壁つかみ中は壁側へ
  ctx.strokeStyle = '#ffe0c0'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  if (esc){
    // よろこんで バンザイ（ふたりのときは 内側の手は つないでいる）
    const two = state.players.length === 2;
    const inner = two ? (pl.id === 0 ? 1 : -1) : 0;
    for (const s of [-1, 1]){
      if (two && s === inner){                       // つないでいる手は 横へ
        ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(s * 6, -16); ctx.stroke();
        continue;
      }
      ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(s * 11, -34); ctx.stroke();
      ctx.beginPath(); ctx.arc(s * 12, -36, 3.4, 0, 7); ctx.fillStyle = '#ffe0c0'; ctx.fill();
    }
  } else if (fly){
    // とんでいる あいだは 手で つかまらず、いきおいよく ふる
    ctx.beginPath(); ctx.moveTo(0, -20);
    ctx.lineTo(-7 - swing * 5, -29 - swing * 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -15);
    ctx.lineTo(10 + swing * 4, -6 + swing * 5); ctx.stroke();
  } else if (onWall){
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(11, -26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(11, -6);  ctx.stroke();
  }

  /* あし。三段跳びの あいだは 大きく けり出す（脚で とぶ 感じ） */
  if (!esc){
    ctx.strokeStyle = '#3a2a55'; ctx.lineWidth = 3.8; ctx.lineCap = 'round';
    if (fly){
      ctx.beginPath(); ctx.moveTo(-2, -7);
      ctx.lineTo(-10 - swing * 8, 1 + swing * 4); ctx.stroke();   // 蹴った あし
      ctx.beginPath(); ctx.moveTo(3, -7);
      ctx.lineTo(8 + swing * 6, -5 - swing * 7); ctx.stroke();    // つぎに つく あし
    } else if (onWall){
      ctx.beginPath(); ctx.moveTo(-2, -7); ctx.lineTo(-5, 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, -7);  ctx.lineTo(7, 0);  ctx.stroke();
    }
  }

  /* うしろ姿。まきゅうの おくを 向いているので 顔は見えない。 */
  // マント（ふたりのときは 1P=むらさき / 2P=みどり で見分ける）
  ctx.fillStyle = (playerCount === 2 && pl.id === 1) ? '#2fae7a' : '#6f4bd8';
  ctx.beginPath();
  ctx.moveTo(-9, -23); ctx.quadraticCurveTo(-14 - (onWall?4:0), -6, -8, -2);
  ctx.lineTo(8, -2); ctx.quadraticCurveTo(14, -6, 9, -23);
  ctx.closePath(); ctx.fill();
  // マントの おれ目
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -3); ctx.stroke();
  // えりもと
  ctx.fillStyle = '#e9e4f5';
  roundRect(-6.5, -25, 13, 6, 3); ctx.fill();
  // うなじ
  ctx.fillStyle = '#ffe0c0';
  roundRect(-3, -26, 6, 4, 2); ctx.fill();
  // あたま（うしろ髪）
  ctx.fillStyle = '#3a2a55';
  ctx.beginPath(); ctx.arc(0, -30, 8, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.ellipse(-2.6, -33, 3.4, 2.2, -0.4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawFx(){
  const f = state.fx;
  for (const d of f.debris){
    const k = clamp(d.t / d.tip, 0, 1);
    const ang = d.side * (Math.PI/2) * k * k + d.spin;   // だんだん速く 倒れる
    const w = BLK_W, h = d.n * CONFIG.UNIT;
    ctx.save();
    ctx.globalAlpha = clamp(d.life / 0.8, 0, 1);
    ctx.translate(d.px + d.dx, d.py + d.dy);             // 足もとが 回る軸
    ctx.rotate(ang);
    drawBlock(-w/2, -h, w, h, d.n, d.tier, 1, 0);
    ctx.restore();
  }
  for (const s of f.sparks){
    ctx.globalAlpha = clamp(s.life / s.max, 0, 1);
    ctx.fillStyle = '#fff0b0';
    ctx.fillRect(s.x - 1.5, s.y - 1.5, 3.5, 3.5);
  }
  ctx.globalAlpha = 1;
  for (const t of f.texts){
    const a = clamp(t.life / t.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '700 22px Consolas,"Segoe UI",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,.85)';
    ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

/* 画面下部の設置レーン：高い所まで手を伸ばさなくても置ける受け皿 */
function drawPlaceLane(){
  const holders = state.players.filter(p => p.held);
  if (!holders.length) return;
  const y = LANE_Y;
  ctx.save();
  ctx.fillStyle = 'rgba(10,7,18,.55)';   // 塔の足もとが すけて見えるように
  ctx.fillRect(0, y, W, LANE_H);
  ctx.strokeStyle = 'rgba(255,217,122,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, y + 1); ctx.lineTo(W, y + 1); ctx.stroke();

  for (let c = 0; c < CONFIG.COLS; c++){
    const owner = holders.find(p => p.cursor === c);
    const x = colX(c), sel = !!owner, ok = sel ? canPlace(owner, c) : !isShaft(c);
    ctx.fillStyle = sel ? (ok ? 'rgba(255,217,122,.30)' : 'rgba(255,90,90,.26)')
                        : 'rgba(255,255,255,.05)';
    ctx.fillRect(x + 2, y + 4, CONFIG.COL_W - 4, LANE_H - 8);
    ctx.strokeStyle = sel ? (ok ? '#ffd97a' : '#ff6a6a') : 'rgba(255,255,255,.16)';
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(x + 2.5, y + 4.5, CONFIG.COL_W - 5, LANE_H - 9);
    ctx.fillStyle = ok ? (sel ? '#ffd97a' : 'rgba(255,255,255,.45)') : '#ff6a6a';
    ctx.font = '700 15px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ok ? (sel ? String(owner.held.n) : '▲') : '×', x + CONFIG.COL_W/2, y + LANE_H/2);
  }
  ctx.fillStyle = 'rgba(255,217,122,.8)';
  ctx.font = '700 12px "Segoe UI","Yu Gothic UI",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ここに おとす', FIELD_X/2, y + LANE_H/2);
  ctx.fillText('ここに おとす', W - FIELD_X/2, y + LANE_H/2);
  ctx.restore();
}

/* 夢石が流れるレーン。ベルトコンベアではなく、
   大魔王の頭から生まれた夢が、古い魔法で よこへ流れているだけ。
   ・ぼんやり光る ・半透明 ・ゆっくり上下にゆれる */
function drawDreamLane(){
  const top = DREAM_Y, bot = DREAM_Y + DREAM_H;
  const x0 = cloudX0(), x1 = cloudX1();

  /* 雲のかたち：まるい胴に、上下へ こぶを たくさん重ねる。
     ぜんぶ同じ色で塗るので、重なりが ひとつの雲に見える。 */
  const paintCloud = (fill, grow) => {
    ctx.fillStyle = fill;
    roundRect(x0 - grow, top + 12 - grow, (x1 - x0) + grow*2, DREAM_H - 24 + grow*2, 26 + grow);
    ctx.fill();
    const n = Math.max(6, Math.round((x1 - x0) / 78));
    const step = (x1 - x0) / n;
    for (let i = 0; i < n; i++){
      const cx = x0 + step * (i + 0.5);
      const wob = Math.sin(state.time * 0.7 + i) * 2;
      ctx.beginPath(); ctx.arc(cx, top + 20 + wob, step * 0.42 + grow, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + step*0.5, bot - 20 - wob, step * 0.36 + grow, 0, 7); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x0 + 16, (top+bot)/2, 24 + grow, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x1 - 16, (top+bot)/2, 24 + grow, 0, 7); ctx.fill();
  };
  paintCloud('rgba(150,180,255,.16)', 7);        // まわりの ぼんやりした光
  paintCloud('rgba(58,44,104,.92)',   0);        // 雲そのもの
  paintCloud('rgba(120,150,230,.10)', -6);       // うちがわの あかるみ

  // 雲の中を ゆるやかに流れる光の筋
  ctx.save();
  ctx.beginPath();
  roundRect(x0, top + 8, x1 - x0, DREAM_H - 16, 30); ctx.clip();
  ctx.globalAlpha = 0.15; ctx.strokeStyle = '#cfe0ff'; ctx.lineWidth = 1.5;
  const off = (state.time * CONFIG.BELT_SPEED * 0.5) % 60;
  for (let x = x0 - 60 + off; x < x1 + 60; x += 60){
    ctx.beginPath();
    ctx.moveTo(x, bot - 14);
    ctx.bezierCurveTo(x + 20, bot - 34, x + 40, top + 30, x + 62, top + 14);
    ctx.stroke();
  }
  ctx.restore();

  // えらぶ場所は ひとつだけ。ふたりでも 同じ夢を見る。
  const pz = pickable(state.players[0]);
  const picks = pz ? [pz] : [];
  {
    const zx = zoneX();
    const px0 = zx - CONFIG.PICK_HALF, pw = CONFIG.PICK_HALF * 2;
    /* ふたりのときは 取り口も ばんの人の色にする。
       のぼりみちの ふだと 同じ色が 光るので、どちらの ばんかが すぐ分かる。 */
    const two = playerCount === 2;
    const trgb = !two ? '190,225,255' : (state.turn === 0 ? '176,142,255' : '106,235,180');
    const pul = two ? 0.5 + Math.sin(state.time * 4.2) * 0.5 : 0;
    ctx.fillStyle = pz ? `rgba(${trgb},${0.16 + pul * 0.12})` : `rgba(${trgb},.05)`;
    ctx.fillRect(px0, top + 14, pw, DREAM_H - 14);
    ctx.strokeStyle = pz || two ? `rgba(${trgb},${0.75 + pul * 0.25})` : 'rgba(255,255,255,.22)';
    ctx.lineWidth = two ? 3.6 : 3; ctx.lineCap = 'round';
    for (const [x, d] of [[px0, 1], [px0 + pw, -1]]){
      ctx.beginPath();
      ctx.moveTo(x + d*9, top + 18); ctx.lineTo(x, top + 18);
      ctx.lineTo(x, bot - 3);        ctx.lineTo(x + d*9, bot - 3);
      ctx.stroke();
    }
    ctx.fillStyle = pz ? '#cfe9ff' : 'rgba(255,255,255,.3)';
    ctx.font = '700 12px "Segoe UI","Yu Gothic UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('ゆめを えらぶ', zx, top + 2);
  }

  /* 夢石は 落ちてくる石と おなじ 大きさ・長さ で見せる。
     雲の中でも 9は9マスぶん 長いので、どれを えらぶか 目で くらべられる。 */
  const midY = DREAM_MID + 2;
  for (const b of state.belt){
    const h = b.n * CONFIG.UNIT, w = BLK_W;
    const sway = Math.sin(state.time * 1.6 + b.ph) * 3;
    const y = midY - h/2 + sway;
    const hi = picks.includes(b);
    // 雲の はしでは すうっと あらわれ／きえる
    const fade = clamp(Math.min(b.x - x0, x1 - b.x) / 34, 0, 1);
    ctx.save();
    ctx.shadowColor = hi ? '#dff2ff' : '#8fb6ff';
    ctx.shadowBlur  = hi ? 20 : 9;
    drawBlock(b.x - w/2, y, w, h, b.n, 0, (hi ? 0.98 : 0.55) * fade, 0);
    ctx.restore();
  }
  // えらべる夢石を指すしるし
  if (pz){
    const bob = Math.sin(state.time * 7) * 2;
    const sway = Math.sin(state.time * 1.6 + pz.ph) * 3;
    ctx.fillStyle = '#cfe9ff';
    ctx.beginPath();
    ctx.moveTo(pz.x, top + 28 + bob + sway * 0.3);
    ctx.lineTo(pz.x - 7, top + 17 + bob + sway * 0.3);
    ctx.lineTo(pz.x + 7, top + 17 + bob + sway * 0.3);
    ctx.closePath(); ctx.fill();
  }
}

function render(){
  ctx.clearRect(0, 0, W, H);
  // 建築ビュー（夢石レーンより下）
  ctx.save();
  ctx.beginPath(); ctx.rect(0, FIELD_TOP, W, H - FIELD_TOP); ctx.clip();
  ctx.translate(state.fx.shakeX, state.fx.shakeY);
  drawBackground();
  drawDemon();
  drawShaft();
  drawTower();
  drawHero();
  drawBubble();
  drawFx();
  for (const pl of state.players) drawGhost(pl);
  ctx.restore();

  drawPlaceLane();

  // 画面の上：大魔王の顔 と 夢石レーン
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, FIELD_TOP); ctx.clip();
  ctx.translate(state.fx.shakeX * 0.5, state.fx.shakeY * 0.5);
  drawDreamLane();
  ctx.restore();

  /* つり糸と 落ちていく夢石は 雲と 建築ビューを またぐので、
     どちらのクリップにも かからないよう 最後に まとめて 描く。 */
  ctx.save();
  ctx.translate(state.fx.shakeX, state.fx.shakeY);
  drawDrops();
  drawFishing();
  ctx.restore();

  // 崩壊フラッシュ
  if (state.fx.flash > 0){
    ctx.fillStyle = `rgba(255,90,60,${state.fx.flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
  // 中央メッセージ
  if (state.msg){
    const a = clamp(state.msg.life / Math.min(0.6, state.msg.max), 0, 1);
    ctx.globalAlpha = a;
    // 長いメッセージは 画面からはみ出さないよう 少しだけ 小さくする
    let fs = 28;
    const setF = n => ctx.font = `700 ${n}px "Segoe UI","Yu Gothic UI",sans-serif`;
    setF(fs);
    while (fs > 15 && ctx.measureText(state.msg.txt).width > W - 36) setF(--fs);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,6,18,.9)';
    ctx.strokeText(state.msg.txt, W/2, FIELD_TOP + 54);
    ctx.fillStyle = '#ffd97a'; ctx.fillText(state.msg.txt, W/2, FIELD_TOP + 54);
    ctx.globalAlpha = 1;
  }
}

/* ギブアップ。石の並びしだいでは どうやっても のぼれなく なるので、
   崩れるのを 待つしかない ときに 自分から やめられるようにする。 */

  gameOver('つぎこそは だっしゅつ！');

function updateHud(){
  updateClimbBtn();
  elGiveUp.hidden = !(state && state.phase === 'play');
  // ストップウォッチは「むずかしい」だけ。だっしゅつしたら その場で 止まる。
  const useWatch = stageIdx === 2 && state && ['play','escape','clear'].includes(state.phase);
  elWatch.hidden = !useWatch;
  if (useWatch) elWatchT.textContent = fmtT(state.phase === 'play' ? state.playT : state.clearT);
  if (playerCount === 2){
    // いま どちらの ばんか（キーの行が 光る）
    if (elKey1) elKey1.classList.toggle('on', state.turn === 0);
    if (elKey2) elKey2.classList.toggle('on', state.turn === 1);
    const t = Math.max(0, state.timeLeft);
    elTNow.textContent = Math.ceil(t);
    elTBar.style.width = clamp(t / CONFIG.TIME_LIMIT * 100, 0, 100) + '%';
    elTBar.classList.toggle('low', t < 30);
  }
  const p0 = state.players[0];
  const h = playerCount === 2
    ? Math.min(...state.players.map(p => Math.max(climbableHeight(p), p.hero.h)))
    : Math.max(climbableHeight(p0), p0.hero.h);
  elHNow.textContent = Math.round(h);
  elHBar.style.width = clamp(h / CONFIG.GOAL_HEIGHT * 100, 0, 100) + '%';

  const q = state.quake, k = QUAKE_KIND[q.kind];
  const warning = q.mode !== 'idle';
  elQLab.classList.toggle('warn', warning);
  elQLab.classList.toggle('roll', q.kind === 'roll');
  elQBar.classList.toggle('roll', q.kind === 'roll');
  if (warning){
    elQLab.textContent = (q.mode === 'shake' ? k.hitMsg : k.warnMsg);
    elQBar.style.width = '100%';
  } else {
    elQLab.textContent = k.label + '（ゆれ' + k.yure + '）まで';
    const total = Math.max(CONFIG.QUAKE_INTERVAL_MIN, CONFIG.QUAKE_INTERVAL - q.count * 1.2);
    elQBar.style.width = clamp((1 - q.t / (q.count === 0 ? CONFIG.QUAKE_FIRST : total)) * 100, 0, 100) + '%';
  }
}

/* ============================ きろく（この端末だけ） ============================
   「むずかしい」で だっしゅつできたときだけ タイムを のこす。
   人数でタイムの意味がちがうので ひとり／ふたりは 別あつかい。 */
const REC_KEY = 'ibiki.records.v1';
const REC_MAX = 60;

function loadRecords(){
  try { const a = JSON.parse(localStorage.getItem(REC_KEY)); return Array.isArray(a) ? a : []; }
  catch (_){ return []; }
}
function saveRecord(rec){
  const a = loadRecords();
  a.push(rec);
  if (a.length > REC_MAX) a.splice(0, a.length - REC_MAX);
  try { localStorage.setItem(REC_KEY, JSON.stringify(a)); } catch (_){ /* 保存できなくても あそべる */ }
}
/** その人数の いちばん はやいタイム（まだ無ければ null） */
function bestTime(p, list){
  const a = (list || loadRecords()).filter(r => r.p === p);
  return a.length ? Math.min(...a.map(r => r.t)) : null;
}
const fmtT = t => t.toFixed(1);
function today(){
  const d = new Date();
  const z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())}`;
}

/* きろくの りれき。この端末に のこした 「むずかしい」の タイム。 */
function showRecords(){
  const all = loadRecords();
  const rows = pc => {
    const a = all.map((r, i) => ({ ...r, i })).filter(r => r.p === pc).reverse();
    if (!a.length) return `<div class="recNone">まだ ありません</div>`;
    const best = Math.min(...a.map(r => r.t));
    return a.map(r => `
      <div class="recRow${r.t === best ? ' best' : ''}">
        <span class="rd">${r.d}</span>
        <span class="rt">${fmtT(r.t)} びょう</span>
        ${r.t === best ? '<span class="rb">ベスト</span>' : ''}
      </div>`).join('');
  };
  const head = pc => {
    const b = bestTime(pc, all);
    return `<div class="recHead">${pc === 1 ? 'ひとり' : 'ふたり'}
      <em>${b === null ? 'きろく なし' : `ベストタイム <b>${fmtT(b)} びょう</b>`}</em></div>`;
  };
  obox.innerHTML = `
    <h1>きろく</h1>
    <p>でぐちの たかさ「むずかしい」で だっしゅつできた タイムです。</p>

function startGame(mode){
  Sfx.init(); Sfx.resume();
  if (mode) gameMode = mode;
  applyStage();
  const tag = document.getElementById('modeTag');
  tag.textContent = 'たかさ:' + STAGES[stageIdx].name +
                    ' ヒント:' + (gameMode === 'hard' ? 'むずかしい' : 'かんたん');
  tag.className   = gameMode === 'hard' ? 'hard' : 'normal';
  state = newState();
  state.phase = 'play';
  for (let i = 0; i < 8; i++) state.queue.push(NUM_BAG[(Math.random()*NUM_BAG.length)|0]);
  /* 雲に 最初から 数個 流しておく。
     ★ ふだん 出てくる 間かく（速さ×時間）と そろえること。
        そろえないと 次に 出る 石と かさなり、
        「数字より 大きい 石」に 見えてしまう。 */
  const gap = CONFIG.BELT_SPEED * CONFIG.SPAWN_INTERVAL;
  for (let i = 1; i <= 4; i++){
    state.belt.push({ n: drawNumber(), x: cloudX0() + i * gap, id: ++uid, ph: Math.random() * 6.28 });
  }
  state.spawnT = CONFIG.SPAWN_INTERVAL;      // 先頭と かさならないよう 1回ぶん おく
  overlay.classList.add('hide');
}

/* でぐちに着いたら、すぐ結果画面には行かず 逃げ出す様子を見せる。
   ひとり … 万歳して よろこび、まどから 外へ
   ふたり … かべの上で 手をつないで よろこび、いっしょに まどから 外へ */
function startEscape(){
  if (state.phase !== 'play') return;
  state.phase = 'escape';
  // 「むずかしい」だけ タイムを のこす（はやさを きそう ステージ）
  state.clearT = state.playT;
  if (stageIdx === 2){
    const prev = bestTime(playerCount);
    state.isBest = prev === null || state.clearT < prev;
    saveRecord({ d: today(), t: +state.clearT.toFixed(1), p: playerCount });
  }
  Sfx.rumbleStop(); Sfx.clear();
  const ps = state.players;
  const cx = ps.reduce((s, p) => s + colX(p.hero.col) + CONFIG.COL_W/2, 0) / ps.length;
  ps.forEach((p, i) => {
    p.esc = {
      x0: heroBaseX(p.hero.col, p.hero.side, p.hero.h),
      x1: ps.length === 2 ? cx + (i === 0 ? -15 : 15) : colX(p.hero.col) + CONFIG.COL_W/2,
      y0: screenY(p.hero.h),
    };
  });
  state.escape = { t: 0, dur: ps.length === 2 ? 3.6 : 2.6 };
}

/** 逃げ出す途中の 立ち位置と ようす */
function escPose(p){
  const e = state.escape, k = clamp(e.t / e.dur, 0, 1);
  const es = p.esc;
  const mv = clamp(k / 0.20, 0, 1);
  const ease = mv < 0.5 ? 2*mv*mv : 1 - Math.pow(-2*mv+2, 2)/2;
  const x = es.x0 + (es.x1 - es.x0) * ease;

  const cheer = k > 0.18 && k < 0.62;                 // よろこんで はねる
  const jump  = cheer ? Math.abs(Math.sin((k - 0.18) / 0.44 * Math.PI * 2.5)) * 20 : 0;
  const rise  = clamp((k - 0.62) / 0.30, 0, 1);
  const top   = screenY(CONFIG.GOAL_HEIGHT) - 110;
  const y     = es.y0 - jump - (es.y0 - top) * (rise * rise);
  const alpha = k > 0.84 ? clamp(1 - (k - 0.84) / 0.16, 0, 1) : 1;
  return { x, y, alpha, cheer: cheer || rise > 0, hands: k > 0.16 };
}

function updateEscape(dt){
  const e = state.escape;
  const before = e.t;
  e.t += dt;
  // よろこんで はねるたび キラッと
  if (Math.floor(before * 4) !== Math.floor(e.t * 4) && e.t < e.dur * 0.62){
    for (const p of state.players){
      const q = escPose(p);
      for (let i = 0; i < 4; i++) addSpark(q.x, screenY(0) - (screenY(0) - q.y) / CONFIG.UNIT);
    }
  }
  if (e.t >= e.dur){ state.phase = 'clear'; winBox(); }
}

function doClear(){ startEscape(); }
function gameOver(reason){
  if (state.phase !== 'play') return;
  state.phase = 'over';
  Sfx.rumbleStop(); Sfx.fail();
  endBox('ざんねん・・・', '#ff7a7a', reason);
}

/* ============================ 9. Loop / Input ============================ */
function update(dt){
  state.time += dt;
  if (state.paused) return;
  if (state.phase === 'escape'){ updateEscape(dt); updateFx(dt); return; }
  if (state.phase !== 'play'){ updateFx(dt); return; }
  state.playT += dt;                       // タイムは あそんでいる あいだだけ

  // ベルト
  state.spawnT -= dt;
  if (state.spawnT <= 0){ state.spawnT = CONFIG.SPAWN_INTERVAL; spawnBeltBlock(); }
  for (const b of state.belt) b.x += CONFIG.BELT_SPEED * dt;
  state.belt = state.belt.filter(b => b.x < cloudX1());   // 雲の右はしで 夢は消える

  // 投げた棒の着地 → このタイミングで固定判定
  let landed = 0;
  for (const col of state.cols) for (const b of col){
    if (b.spawn > 0){ b.spawn -= dt; if (b.spawn <= 0){ b.spawn = 0; landed++; } }
  }
  if (landed){ Sfx.place(); applyLocks(); }

  /* ふだんのいびき。大魔王の呼吸（sin(time*0.9)＝約7秒）に合わせて鳴らす。
     口が開くのと 音が だいたい そろう。 */
  state.snoreT -= dt;
  if (state.snoreT <= 0){
    state.snoreT = 6.98;
    Sfx.snore(state.quake.mode === 'idle' ? 1 : 0.4);   // ゆれの最中は ひかえめに
    state.snoreW = 1;                                   // グラグラの石が ひとゆれ する
  }
  if (state.snoreW > 0) state.snoreW = Math.max(0, state.snoreW - dt / CONFIG.SNORE_WOBBLE_T);

  updateQuake(dt);
  updateHero(dt);
  updateFx(dt);

  // 制限時間（ふたりのときだけ）
  if (CONFIG.TIME_LIMIT > 0 && state.phase === 'play'){
    state.timeLeft -= dt;
    if (state.timeLeft <= 0){
      state.timeLeft = 0;
      gameOver('じかん ぎれ！ ふたり そろって にげよう');
    }
  }

  /* カメラ。塔の足もとが見えなくなるのを いちばん嫌うので、
     てっぺんが画面の上に つかえそうになるまで 動かさない。 */
  const focus = Math.max(towerMax(), ...state.players.map(p => p.hero.h), 6);
  const target = clamp(focus + 4 - VIS_UNITS, 0, CAM_MAX);
  state.cam += (target - state.cam) * Math.min(1, dt * 3.2);
}

/* 途中で失敗しても まっくらにならないようにする。
   render() は はじめに画面を消すので、そのあとで落ちると 何も見えなくなり
   原因も分からない。落ちたら 画面に理由を出して、ループは続ける。 */
let crashMsg = null;
function drawCrash(err){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#1a1030'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff9a9a'; ctx.font = '700 16px "Segoe UI","Yu Gothic UI",sans-serif';
  ctx.fillText('エラーが おきました', W/2, H/2 - 26);
  ctx.fillStyle = '#e8e3f0'; ctx.font = '12px Consolas,monospace';
  const m = String((err && err.message) || err).slice(0, 90);
  ctx.fillText(m, W/2, H/2 + 2);
  ctx.fillStyle = '#9a90b4'; ctx.font = '12px "Segoe UI","Yu Gothic UI",sans-serif';
  ctx.fillText('この文を おしえてください', W/2, H/2 + 30);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try {
    update(dt);
    render();
    updateHud();
    crashMsg = null;
  } catch (err){
    crashMsg = err;
    try { drawCrash(err); } catch (_){ /* ここで落ちたら もう何もできない */ }
    if (window.console) console.error(err);
  }
  requestAnimationFrame(loop);
}

/* ---- キーボード ---- */
const KEY = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(e.key)) e.preventDefault();
  if (KEY[e.code]) return;
  KEY[e.code] = true;
  Sfx.resume();

  if (state.paused){ if (['Enter','Space','Escape'].includes(e.code)) closeHelp(); return; }
  if (state.phase === 'title'){ if (e.code === 'Enter' || e.code === 'Space') startGame(); return; }
  if (state.phase !== 'play'){ if (e.code === 'Enter' || e.code === 'KeyR') startGame(); return; }

  const P1 = state.players[0], P2 = state.players[1];
  const mv = (p, d) => { p.cursor = clamp(p.cursor + d, 0, CONFIG.COLS - 1); };
  if (playerCount === 2){
    // 1P は左手（ASWD）、2P は右手（やじるし）
    switch (e.code){
      case 'KeyA': mv(P1, -1); break;
      case 'KeyD': mv(P1, +1); break;
      case 'KeyW': grab(P1);   break;
      case 'KeyS': place(P1, P1.cursor); break;
      case 'ArrowLeft':  mv(P2, -1); break;
      case 'ArrowRight': mv(P2, +1); break;
      case 'ArrowUp':    grab(P2);   break;
      case 'ArrowDown': case 'Space': place(P2, P2.cursor); break;
      case 'KeyQ': climbTap(P1); break;      // 1P は 左手の Q
      case 'KeyP': climbTap(P2); break;      // 2P は 右手の P
    }
    return;
  }
  switch (e.code){
    case 'ArrowLeft':  mv(P1, -1); break;
    case 'ArrowRight': mv(P1, +1); break;
    case 'ArrowUp': case 'KeyZ': grab(P1); break;
    case 'ArrowDown': case 'Space': place(P1, P1.cursor); break;
    case 'KeyP': case 'KeyQ': climbTap(P1); break;
  }
});
addEventListener('keyup', e => { KEY[e.code] = false; });

/* ---- マウス／タッチ（共通） ----
   建築エリアはどこを触っても、その柱の一番上に置く。
   画面端（石壁の上）を触った場合も、いちばん近い柱に寄せる。 */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
const colAt = x => clamp(Math.floor((x - FIELD_X) / CONFIG.COL_W), 0, CONFIG.COLS - 1);

/* ---- ふたりのとき、どちらの手が うごくか ----
   石を もっているのは 一人だけなら、画面の どちら側を 触っても その人が置く。
   ＝「だれが とっても、どこにでも 置ける」。
   ふたりとも 手がふさがっている／ふたりとも 空いている ときだけ、
   触った場所に 近いほうを えらぶ。 */
const nearestPlayer = x => state.players.reduce((a, b) =>
  Math.abs(colX(b.hero.col) - x) < Math.abs(colX(a.hero.col) - x) ? b : a);

function whoseGrab(x){
  if (playerCount === 1) return state.players[0];
  return state.players[state.turn];         // かわりばんこ
}
function whosePlace(x){
  if (playerCount === 1) return state.players[0];
  const hold = state.players.filter(p => p.held);
  return hold.length === 1 ? hold[0] : nearestPlayer(x);
}
function pointerMove(p){
  if (!state || state.phase !== 'play') return;
  if (p.y >= FIELD_TOP) whosePlace(p.x).cursor = colAt(p.x);
}
function pointerDown(p){
  Sfx.resume();
  if (!state || state.phase !== 'play') return;
  /* 手が空いているときは 画面の どこを 触っても 夢石が とれる。
     （小さい子が 雲まで 手をのばさなくて すむように）
     もっているときだけ、触った柱へ おとす。 */
  if (p.y < FIELD_TOP){ grab(whoseGrab(p.x)); return; }
  const pl = whosePlace(p.x);
  if (!pl.held){ grab(whoseGrab(p.x)); return; }
  pl.cursor = colAt(p.x);
  place(pl, pl.cursor);
}

cv.addEventListener('mousemove', e => pointerMove(canvasPos(e)));
cv.addEventListener('mousedown', e => { pointerMove(canvasPos(e)); pointerDown(canvasPos(e)); });
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const p = canvasPos(e.changedTouches[0]);
  pointerMove(p); pointerDown(p);
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  pointerMove(canvasPos(e.changedTouches[0]));
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---- リサイズ ---- */
const stage = document.getElementById('stage');
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  DPR = dpr;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // ビューポートが取れない環境で scale(0) になって消えないよう下限を置く
  const availW = window.innerWidth  || W + 20;
  const availH = window.innerHeight || stage.offsetHeight + 20;
  const s = Math.min(1, availW / (W + 20), availH / (stage.offsetHeight + 20));
  stage.style.transform = `scale(${Math.max(0.3, s)})`;
}
addEventListener('resize', resize);
document.getElementById('helpBtn').onclick = showHelp;

/* ---- おとの入切（どの画面でも押せる） ---- */
const muteBtn = document.getElementById('muteBtn');
const SPK_ON  = `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/>
  <path d="M16 8.5a5 5 0 0 1 0 7M18.7 6a8.5 8.5 0 0 1 0 12" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const SPK_OFF = `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/>
  <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round"/></svg>`;
function paintMute(){
  muteBtn.innerHTML = Sfx.isMuted() ? SPK_OFF : SPK_ON;
  muteBtn.classList.toggle('off', Sfx.isMuted());
  muteBtn.title = Sfx.isMuted() ? 'おとを だす' : 'おとを けす';
}
muteBtn.onclick = e => {
  e.stopPropagation();                 // タイトル画面で ゲームが始まらないように
  Sfx.init(); Sfx.resume();
  Sfx.setMute(!Sfx.isMuted());
  paintMute();
  if (!Sfx.isMuted()) Sfx.click();     // 音を戻したときだけ 確認の音
};
paintMute();

/* ---- 起動 ---- */
state = newState();
applyStage();
resize();
showIntro();
requestAnimationFrame(loop);
</script>
</body>
