<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ずつ分け農園 直売店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 藍ののれん（見出し）→ 収穫箱＋入れものの山 → 店先の木の台。昔の八百屋の店先を一画面に。 */
:root{
  color-scheme: light;
  --wall:#e4e8ee;      /* しっくい壁（青みのグレー） */
  --ai:#24386a;        /* 藍：のれん */
  --ai-soft:#3b5291;
  --wood:#b68653;      /* 台・木箱 */
  --wood-dark:#6f4a2a;
  --paper:#f3e7cc;     /* 値札の紙 */
  --ink:#2a2730;
  --shu:#c4432b;       /* 朱：はんこ・ネット */
  --leaf:#4d7a38;
  --white:#ffffff;
  --display:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--shu);outline-offset:2px}

.noren{background:var(--ai);color:var(--white);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 18px;position:relative}
.noren::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--ai) 0 22%,var(--wall) 22% 25%)}
.noren-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.noren h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,30px);margin:0;letter-spacing:.08em;text-wrap:balance}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--ai-soft);opacity:.55;position:relative}
.chip.now{opacity:1;background:var(--paper);box-shadow:0 0 0 3px var(--white)}
.chip.done{opacity:1}
.chip.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--leaf);color:var(--white);font-size:12px;display:grid;place-items:center;font-weight:900}
.purse{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 14px 4px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#d9a521 70%);border:2px solid #a7790f;display:inline-grid;place-items:center;font-size:12px;color:#7a5508;font-weight:900}
.purse.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.mute{background:none;border:2px solid rgba(255,255,255,.5);border-radius:10px;color:var(--white);padding:2px 10px;cursor:pointer;font-size:14px}

main{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}

.talk{display:flex;align-items:flex-start;gap:10px}
.face{font-size:38px;line-height:1}
.bubble{flex:1;min-width:0;background:var(--white);border-radius:16px;padding:10px 16px;font-weight:700;position:relative;border:2px solid var(--ai)}
.bubble::before{content:"";position:absolute;left:-10px;top:14px;border:8px solid transparent;border-right-color:var(--ai);border-left:0}
.bubble.nudge{animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.yard{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:stretch}
.label{font-family:var(--display);font-size:15px;letter-spacing:.05em;color:var(--wood-dark);margin:0 0 6px}
.crate{position:relative;background:linear-gradient(var(--wood),#a77945);border:6px solid var(--wood-dark);border-radius:6px;padding:8px 10px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.pile{display:flex;flex-wrap:wrap;gap:2px}
.item{width:var(--it,38px);height:var(--it,38px);border:none;background:none;font-size:calc(var(--it,38px)*.68);cursor:pointer;border-radius:8px;padding:0;line-height:1}
.item:hover{background:rgba(255,255,255,.25)}
.item:active{transform:scale(.85)}
.pile{touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:1;gap:calc(var(--it,38px)*.26)}
.pile{display:grid;grid-template-columns:repeat(var(--pc,10),var(--it,38px));justify-content:start}
.lasso{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.lasso path{stroke-linejoin:round;stroke-linecap:round}
.gtags{position:absolute;inset:0;pointer-events:none;z-index:3}
.gtag{position:absolute;width:22px;height:22px;border-radius:50%;color:var(--white);font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid var(--white);font-variant-numeric:tabular-nums;animation:pop .25s ease-out}
.item.grouped{cursor:default}
.item.grouped:hover{background:none}
.packarea{background:rgba(255,255,255,.55);border:3px dashed var(--wood);border-radius:10px;padding:14px 12px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.pno{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);min-width:22px;height:22px;border-radius:11px;color:var(--white);font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid var(--white);z-index:2}
.lane{position:relative;height:96px;overflow:hidden}
.guest{position:absolute;left:50%;bottom:0;display:flex;align-items:flex-end;gap:14px;transform:translateX(-50%);animation:walkin .6s ease-out both}
.guest.bye{animation:walkout .5s ease-in forwards}
@keyframes walkin{from{transform:translateX(60vw)}}
@keyframes walkout{to{transform:translateX(-80vw)}}
.gface{font-size:44px;line-height:1}
.gone{display:flex;flex-direction:column;align-items:center;gap:2px}
.gsay{background:var(--white);border:2px solid var(--ai);border-radius:12px;padding:0 8px;font-weight:700;font-size:13px;line-height:1.9;white-space:nowrap;animation:pop .3s ease-out both}
#box{display:inline-block}
.per-n{color:#2f7d32;font-size:1.5em;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.card-top{display:flex;justify-content:flex-start;margin:-6px 0 2px}
.adult{margin-top:14px;text-align:left;background:var(--white);border-radius:10px;padding:8px 12px;font-size:14px}
.adult summary{cursor:pointer;font-weight:900;color:var(--ai)}
.rule-tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;line-height:1.5}
.rule-tbl th,.rule-tbl td{border:1px solid #d8cfb8;padding:4px 6px;vertical-align:middle}
.rule-tbl thead th{background:#efe6cf}
.rule-tbl tr.grp th{background:#f7f1e2;text-align:left}
.rule-tbl td:nth-child(2),.rule-tbl td:nth-child(3),.rule-tbl thead th{white-space:nowrap}
.rule-tbl td:nth-child(3){text-align:center}
.rule-tbl small{font-weight:400;color:#6b5d42}
.rule-note{font-size:12px;color:#6b5d42;margin:6px 0 0}
.how-list{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:10px}
.how{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;background:var(--white);border-radius:10px;padding:8px 12px;line-height:1.9}
.how-n{width:28px;height:28px;border-radius:50%;background:var(--ai);color:var(--white);font-weight:900;display:grid;place-items:center;margin-top:4px}
.how b{font-size:16px}
.how p{margin:2px 0 0;font-size:15px}
.offrow{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:rgba(255,255,255,.55);border-radius:10px;padding:2px 10px;position:relative;z-index:1}
.off-l{font-size:13px;font-weight:700;color:var(--wood-dark)}
.off-i{display:inline-flex;align-items:center;gap:2px}
.off-a{font-size:22px;line-height:1;filter:grayscale(.7) opacity(.7)}
.off-i small{font-size:11px;line-height:1}
.farm-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.zk-count{font-size:20px;margin:4px 0}
.zk-count b{color:var(--shu);font-size:1.4em}
.zk-bar{height:12px;border-radius:6px;background:rgba(36,56,106,.12);overflow:hidden;margin:0 0 6px}
.zk-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#8cc06a);border-radius:6px}
.zk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px;text-align:center}
.zk{background:var(--white);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;line-height:1.5}
.zk .zi{font-size:36px;line-height:1.1}
.zk small{font-size:11px;color:#6b5d42;line-height:1.5}
.zk.no{background:rgba(255,255,255,.45);border:2px dashed #cdbf9f}
.zk.no .zi{filter:brightness(0) opacity(.22)}
.zk.no b{color:#8a7a5c}
.zk-new{background:#fff7d6;border:2px dashed #e0b437;border-radius:10px;padding:6px 10px;font-weight:700}
.rankbadge{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:var(--white);border:2px solid rgba(255,255,255,.45);border-radius:999px;padding:2px 12px;font-weight:900;font-size:14px;cursor:pointer;line-height:1.9}
.rankbadge rt{font-size:.55em}
.rk-star{color:#ffd54a;font-variant-numeric:tabular-nums}
.rk-list{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:10px}
.rk-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--white);border-radius:10px;padding:6px 12px;font-weight:700;line-height:1.9}
.rk-row .rk-i{font-size:24px;text-align:center}
.rk-row .rk-at{color:#c98c12;font-variant-numeric:tabular-nums}
.rk-row.now{box-shadow:0 0 0 3px var(--shu);background:#fff7d6}
.rk-row.lock{opacity:.55}
.rank-up{background:#fff3c4;border:3px solid #e0b437;border-radius:12px;padding:8px 12px;font-weight:900;margin:8px 0;animation:pop .4s ease-out}
.rank-up b{font-size:1.3em;color:var(--shu)}
.rank-up .rk-story{display:inline-block;margin-top:4px;color:var(--ai);font-size:1.05em}
.rank-up small{font-weight:700;color:#6b5d42}
.got-n{color:#d6281b;font-size:1.7em;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
#box.nudge{animation:nudge .4s}
.item.sel{background:rgba(255,255,255,.55);box-shadow:0 0 0 3px var(--paper);transform:scale(1.12)}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.trail polyline{fill:none;stroke:rgba(255,255,255,.85);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.item.taken{pointer-events:none;animation:pick .25s ease-in forwards}
@keyframes pick{to{transform:translateY(-14px) scale(.4);opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.item.taken{visibility:hidden}}
.count-left{font-family:var(--display);color:var(--paper);font-size:15px;margin-top:6px}

.stackbox{display:flex;flex-direction:column;align-items:center}
.stack{width:100%;flex:1;min-height:150px;border:none;background:rgba(255,255,255,.45);border-radius:10px;cursor:pointer;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding:10px 6px;gap:0}
.stack:hover{background:rgba(255,255,255,.75)}
.stack.wiggle{animation:nudge .4s}
.layer{width:84px;height:18px;border-radius:4px 4px 8px 8px;margin-top:-5px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.stack-n{font-family:var(--display);font-size:14px;margin-top:6px;color:var(--wood-dark)}

.counter-wrap{display:flex;flex-direction:column}
.counter{background:var(--paper);border-top:14px solid var(--wood);border-bottom:10px solid var(--wood-dark);border-radius:4px;padding:14px 12px 12px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.empty-note{color:#8a7a5c;font-size:15px}
.made{font-family:var(--display);font-size:16px;margin-left:auto;color:var(--wood-dark)}

/* いれもの */
.cont{position:relative;padding:8px;border-radius:8px 8px 12px 12px;animation:drop .35s ease-out both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.slots{display:grid;grid-template-columns:repeat(var(--cols),var(--sl,30px));gap:3px}
.slot{width:var(--sl,30px);height:var(--sl,30px);display:grid;place-items:center;font-size:calc(var(--sl,30px)*.73);line-height:1;border-radius:50%}
.slot.in{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}}
.t-pack{background:rgba(255,255,255,.75);border:2px solid #b9c3cf}
.t-pack .slot{background:radial-gradient(circle at 50% 60%,#e6ebf1,#c9d2dc);box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
.t-kago{background:repeating-linear-gradient(45deg,#c9a467 0 5px,#a98247 5px 10px),#c9a467;border:3px solid #86622f;border-radius:6px 6px 22px 22px}
.t-kago .slot{background:rgba(0,0,0,.08)}
.t-tie{background:none;border:2px dashed #b08a5a}
.t-tie::before{content:"";position:absolute;left:50%;top:-6px;width:4px;height:14px;background:var(--shu);border-radius:2px;transform:translateX(-50%)}
.t-tie .slot{background:rgba(176,138,90,.15)}
.t-net{background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(196,67,43,.55) 7px 9px),repeating-linear-gradient(-45deg,transparent 0 7px,rgba(196,67,43,.55) 7px 9px);border:2px solid var(--shu);border-radius:10px 10px 18px 18px}
.t-net .slot{background:rgba(255,255,255,.45)}
.t-band{background:none;border:2px dashed #7da35f}
.t-band::before{content:"";position:absolute;left:6px;right:6px;top:58%;height:4px;background:#3c6fd1;border-radius:2px;z-index:1}
.t-band .slot{background:rgba(106,168,79,.14);font-size:calc(var(--sl,30px)*.87)}
.t-sara{background:radial-gradient(ellipse at 50% 50%,#ffffff 0 60%,#dfe4ea 61% 66%,#ffffff 67%);border:2px solid #c9d1da;border-radius:50%;padding:16px 22px}
.lay-band{background:#cfe3c0;border:2px dashed #7da35f}
.lay-sara{background:#ffffff;border:2px solid #c9d1da;border-radius:50%}
.asp{display:inline-block;vertical-align:middle}
.t-bin{background:rgba(255,255,255,.75);border:2px solid #9fb4c7;border-radius:10px 10px 12px 12px;padding-top:16px}
.t-bin::before{content:"";position:absolute;left:50%;top:-8px;width:20px;height:10px;transform:translateX(-50%);background:#3c6fd1;border-radius:3px 3px 0 0}
.t-bin .slot{background:rgba(159,180,199,.18)}
.t-box{background:#d9b98a;border:3px solid #a5824f;border-radius:4px}
.t-box .slot{background:rgba(0,0,0,.07);border-radius:6px}
.lay-bin{background:rgba(255,255,255,.9);border:2px solid #9fb4c7;width:36px!important;height:24px}
.lay-box{background:#d9b98a;border:2px solid #a5824f}
.t-bag{background:rgba(255,255,255,.6);border:2px solid #b7c4b0;border-radius:6px 6px 16px 16px;padding-top:16px}
.t-bag::before{content:"";position:absolute;left:50%;top:-6px;width:14px;height:12px;transform:translateX(-50%);background:var(--shu);border-radius:3px}
.t-bag .slot{background:rgba(156,194,70,.12)}
.lay-bag{background:rgba(255,255,255,.9);border:2px solid #b7c4b0}
.lay-pack{background:rgba(255,255,255,.9);border:2px solid #b9c3cf}
.lay-kago{background:repeating-linear-gradient(45deg,#c9a467 0 4px,#a98247 4px 8px);border:2px solid #86622f}
.lay-tie{background:#d9bf93;border:2px dashed #b08a5a}
.lay-net{background:repeating-linear-gradient(45deg,#f7d9cf 0 4px,var(--shu) 4px 6px);border:2px solid var(--shu)}

.cont .cstamp{display:none;line-height:1.2;white-space:nowrap;position:absolute;right:-12px;top:-14px;width:42px;height:42px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);
  font-family:var(--display);font-size:12px;place-items:center;background:rgba(243,231,204,.85);transform:rotate(-14deg);animation:stamp .3s ease-out;z-index:2}
.cont.full .cstamp{display:grid}
.cstamp rt{font-size:.6em}
@keyframes stamp{from{transform:rotate(-14deg) scale(2);opacity:0}}
.badge{position:absolute;left:-10px;top:-12px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--ai);color:var(--white);font-weight:900;display:none;place-items:center;font-variant-numeric:tabular-nums}
.cont.sold .badge{display:grid;animation:pop .3s}
.cont.sold{opacity:.55;transition:opacity .4s}
.cont.sold .cstamp{border-color:var(--leaf);color:var(--leaf)}
.cont.eaten{opacity:.6;transition:opacity .4s}
.cont.eaten .cstamp{border-color:#c98c12;color:#c98c12}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.actions:empty{display:none}
.talk .back{align-self:center;flex:none}
.btn{border:none;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:900;cursor:pointer;background:var(--ai);color:var(--white);box-shadow:0 4px 0 #15224a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #15224a}
.btn.sub{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 #b9a679}
.btn:disabled{opacity:.4;cursor:default}

/* オーバーレイ（値札の紙） */
.overlay{position:fixed;inset:0;background:rgba(36,56,106,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:6px;max-width:440px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;max-height:100%;overflow:auto}
.card::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--wall);transform:translateX(-50%);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.big{font-size:64px;line-height:1.1;margin-top:8px}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:8px 0 4px;text-wrap:balance}
.card p{margin:4px 0}
.rule{display:inline-block;margin:10px 0;padding:6px 14px;border:2px solid var(--ink);font-family:var(--display);font-size:20px;background:var(--white)}
.q{font-weight:900;margin-top:12px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 16px}
.num{border:2px solid var(--ai);background:var(--white);border-radius:10px;font-size:20px;font-weight:900;padding:6px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.num.on{background:var(--ai);color:var(--white)}
.n-total{color:var(--shu)}
.n-per{color:#2f7d32}
.n-ans{color:var(--ai)}
.card h2 .n-total,.card h2 .n-per,.card h2 .n-ans{border-bottom:3px solid currentColor;padding-bottom:1px}
.eq .op{color:#8a7a5c}
.eq{font-family:var(--display);font-size:clamp(36px,10vw,52px);color:var(--ai);margin:6px 0;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:#6b5d42}
.star{color:#c98c12;font-weight:900}

/* のうえん */
.farmview,.shopview{display:flex;flex-direction:column;gap:14px}
.farm-q{font-family:var(--display);font-weight:400;font-size:clamp(18px,4vw,22px);text-align:center;margin:6px 0 0;color:var(--ai);line-height:1.9;text-wrap:balance}
rt{font-family:var(--body);font-size:.45em;font-weight:700;letter-spacing:0}
.farm{position:relative;border:5px solid var(--wood-dark);border-radius:16px;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 30% at 20% 32%,#a9d184 0 99%,transparent 100%),
    radial-gradient(ellipse 70% 34% at 85% 34%,#93c46f 0 99%,transparent 100%),
    linear-gradient(#cfe3f3 0 30%,#86b862 30% 100%);

function cnt(n, s){
  const d = n % 10;
  if(s.c==="hon")  return n + `<ruby>本<rt>${d===1||d===6||d===8||d===0 ? "ぽん" : d===3 ? "ぼん" : "ほん"}</rt></ruby>`;
  if(s.c==="hiki") return n + (d===1||d===6||d===8||d===0 ? "ぴき" : d===3 ? "びき" : "ひき");
  if(s.c==="L")    return n + "リットル";
  const W = {saya:"さや", fusa:"ふさ", tsubu:"つぶ", mai:"まい"};
  if(W[s.c]) return n + W[s.c];
  return n + "こ";
}

function tone(f, d=.1, type="triangle", vol=.15, delay=0){
  const a = ac(); if(!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
}

const GCOL = ["#c4432b","#24386a","#4d7a38","#8b5aa6","#d9822b","#2b8a9a"];
function hull(p){
  if(p.length < 3) return p;
  p = p.slice().sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
  const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for(const q of p){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(const q of p.slice().reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
function drawLasso(){
  const svg = $("lasso"), tags = $("tags");
  if(!st){ svg.innerHTML = ""; tags.innerHTML = ""; return; }
  const r = $("crate").getBoundingClientRect(), iw = (pileEl.querySelector(".item")||{}).offsetWidth || 38;
  let h = "", t = "";
  st.groups.forEach((g,k)=>{
    if(g.packed) return;
    const col = GCOL[k % GCOL.length], runs = [];
    let cur = null, pi = -9, py = null;
    g.items.slice().sort((a,b)=>a.dataset.i-b.dataset.i).forEach(b=>{
      const q = b.getBoundingClientRect(), pt = [q.left+q.width/2-r.left, q.top+q.height/2-r.top], i = +b.dataset.i;
      if(cur && i===pi+1 && Math.abs(pt[1]-py)<2) cur.push(pt); else { cur = [pt]; runs.push(cur); }
      pi = i; py = pt[1];
    });
    runs.forEach(run=>{   // となりあう ものを よこ長の 丸で かこむ（ななめに しない）
      const a = run[0], z = run[run.length-1], d = `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${(z[0]+.1).toFixed(1)} ${z[1].toFixed(1)}`;
      h += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${iw+10}"/><path d="${d}" fill="none" stroke="#dcb98a" stroke-width="${iw+2}"/>`;
      t += `<span class="gtag" style="left:${a[0]-iw*.68}px;top:${a[1]-iw*.74}px;background:${col}">${k+1}</span>`;
    });
  });
  svg.innerHTML = h; tags.innerHTML = t;
}

  const minIt = innerWidth < 600 ? 36 : 22;   // スマホでは ゆびで さわれる 大きさを のこす（スクロールは しかたない）
  while(!fits() && it > minIt){
    for(sl = Math.round(it*.8) - 2; sl >= Math.max(16, Math.round(it*.5)); sl -= 2){ set(); if(fits()) break; }
    if(fits()) break;
    sl = 0; it -= 2; set();
  }
  drawLasso();
}

function pickItem(el){
  if(!st || st.phase!=="group" || st.busy || !el || el.classList.contains("grouped")) return;
  const s = S();
  if(st.cur.includes(el)){ st.cur = st.cur.filter(x=>x!==el); el.classList.remove("sel"); tone(300,.06); sayCur(); return; }
  st.cur.push(el); el.classList.add("sel"); sPop(st.cur.length);
  if(st.cur.length===s.per) formGroup(); else sayCur();
}
function sayCur(){
  const s = S();
  say(st.cur.length ? `${cnt(st.cur.length,s)} えらんだ。あと ${cnt(s.per-st.cur.length,s)}で <ruby>丸<rt>まる</rt></ruby>が できるよ` : `${s.name}を ${cnt(s.per,s)}ずつ えらんで、<ruby>丸<rt>まる</rt></ruby>で かこもう`);
}
function formGroup(){
  const s = S(), g = {items:st.cur, packed:false}; st.cur = [];
  g.items.forEach(b=>{ b.classList.remove("sel"); b.classList.add("grouped"); b.disabled = true; });
  st.groups.push(g); drawLasso(); updatePileLeft(); sFull();
  say(`${cnt(s.per,s)}の <ruby>丸<rt>まる</rt></ruby>が ${st.groups.length}こ できた！`);

  if(grouped()===s.total) setTimeout(allGrouped, 600);

}
function bulk(){
  if(!st || st.busy || st.phase!=="group") return;
  st.cur.forEach(b=>b.classList.remove("sel")); st.cur = [];
  const s = S(), free = [...pileEl.querySelectorAll(".item:not(.grouped)")], times = free.length / s.per;
  st.busy = true; renderActions();
  for(let k=0;k<times;k++) setTimeout(()=>{
    st.cur = free.slice(k*s.per, (k+1)*s.per); st.cur.forEach(b=>b.classList.add("sel"));
    if(k===times-1) st.busy = false;
    formGroup();
  }, k*450);
}

/* ---- なぞって えらぶ ---- */
let drag = null;
function hitItem(e){ const h = document.elementFromPoint(e.clientX, e.clientY); return h && h.closest ? h.closest(".item") : null; }
function drawTrail(){
  const r = $("crate").getBoundingClientRect();
  $("trail").firstElementChild.setAttribute("points", drag ? drag.pts.map(([x,y])=>`${x-r.left},${y-r.top}`).join(" ") : "");
}
pileEl.addEventListener("pointerdown", e => {
  if(!st || st.phase!=="group" || st.busy) return;
  if(e.button !== undefined && e.button > 0) return;
  e.preventDefault();
  drag = {pts:[[e.clientX,e.clientY]], seen:new Set()};
  try{ pileEl.setPointerCapture(e.pointerId); }catch(err){}
  const el = hitItem(e); if(el){ drag.seen.add(el); pickItem(el); }
  drawTrail();
});
pileEl.addEventListener("pointermove", e => {
  if(!drag) return;
  drag.pts.push([e.clientX,e.clientY]);
  const el = hitItem(e);
  if(el && !drag.seen.has(el)){ drag.seen.add(el); if(!st.cur.includes(el)) pickItem(el); }
  drawTrail();
});
function dragEnd(){ if(!drag) return; drag = null; drawTrail(); }
pileEl.addEventListener("pointerup", dragEnd);
pileEl.addEventListener("pointercancel", dragEnd);

const tut = {step:0, started:false, target:null, mode:null};
function tutStep(n){
  if(tutorialDone || !st) return;
  const s = S();
  const T = {
    1:[pileEl, `① ${s.name}を ゆびで なぞって ${cnt(s.per,s)} えらぶと、<ruby>丸<rt>まる</rt></ruby>で かこまれるよ（1こずつ タップしても いいよ）`, "trace"],
    2:[pileEl, `② のこりも ${cnt(s.per,s)}ずつ かこもう。ぜんぶ かこむと ${s.unit}に <ruby>入<rt>はい</rt></ruby>るよ`, null],
  }[n];
  if(!T) return;
  tut.step = n; tut.target = T[0]; tut.mode = T[2];
  $("coachTip").innerHTML = T[1];
  $("coach").hidden = false;
  const r = tut.target.getBoundingClientRect();
  if(r.top < 60 || r.bottom > innerHeight - 140){ try{ tut.target.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }
  requestAnimationFrame(tutPlace);
  if(n===2) setTimeout(()=>{ if(tut.step===2) tutHide(); }, 3500);
}
function tutHide(){ tut.step = 0; $("coach").hidden = true; }
function tutPlace(){
  if(!tut.step) return;
  const r = tut.target.getBoundingClientRect(), pad = 8;
  const ring = $("coachRing"), tip = $("coachTip"), hand = $("coachHand");
  Object.assign(ring.style, {left:(r.left-pad)+"px", top:(r.top-pad)+"px", width:(r.width+pad*2)+"px", height:(r.height+pad*2)+"px"});
  const tw = Math.min(360, innerWidth - 32);
  tip.style.width = tw + "px";
  tip.style.left = Math.max(16, Math.min(innerWidth - tw - 16, r.left + r.width/2 - tw/2)) + "px";
  const th = tip.offsetHeight;
  let top = r.bottom + pad + 14;
  if(top + th > innerHeight - 12) top = Math.max(12, r.top - pad - 14 - th);
  tip.style.top = top + "px";
  hand.className = "coach-hand";
  if(tut.mode === "trace"){
    const items = [...pileEl.querySelectorAll(".item:not(.grouped)")].slice(0, S().per);
    if(items.length > 1){
      const a = items[0].getBoundingClientRect(), b = items[items.length-1].getBoundingClientRect();
      hand.style.left = (a.left + a.width/2) + "px"; hand.style.top = (a.top + a.height/2) + "px";
      hand.style.setProperty("--dx", (b.left - a.left) + "px"); hand.style.setProperty("--dy", (b.top - a.top) + "px");
      hand.classList.add("trace");
    } else hand.classList.add("off");
  } else hand.classList.add("off");
  requestAnimationFrame(tutPlace);
}

const GUESTS = ["👵","👴","👩","🧒","👨","👧","🧑‍🦳","👩‍🍳"];
function openStore(){
  const s = S(), n = st.n;
  st.phase = "sell";
  const left = (tut.started || (st.firstTry!==false && !st.afterWrong)) ? 0 : 1;   // まちがえたら 1つ うれのこる（わからない → かこんでから 正かいなら ぜんぶ うれる）
  const order = [...Array(n).keys()].sort(()=>Math.random()-.5).slice(0, n-left);
  say("いらっしゃい、いらっしゃい！");
  // 5人いじょうなら 2〜3人ずつ まとめて くる
  const batches = [];
  for(let k=0; k<order.length; ){ const m = order.length >= 5 ? Math.min(order.length-k, 2 + Math.floor(Math.random()*2)) : 1; batches.push(order.slice(k, k+m)); k += m; }
  if(batches.length > 1 && batches[batches.length-1].length===1 && order.length >= 5) batches[batches.length-2].push(...batches.pop());   // さいごが 1人だけに ならないように
  let t = 900;
  batches.forEach(b=>{ setTimeout(()=>guest(b), t); t += 1300 + (b.length-1)*250; });

    </div>
  `);
  if(hit) [880,1100,1320].forEach((f,i)=>tone(f,.2,"sine",.12,i*.1));
  if(r1!==r0) [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,"sine",.12,.4+i*.11));
  $("again").onclick = () => {
    // 1回目で 正かいして ぜんぶ 売れた（または れんしゅう中）なら、もう一どは れんしゅう（コイン1まい・正かいなら★1）
    if(P || (gain > 0 && left === 0)){ closeCard(); startStage(si, true); return; }
    addCoins(-sold); earned -= sold; stars -= gain; updateRank(); done.delete(doneKey(s)); if(!--zukan[s.key]) delete zukan[s.key]; closeCard(); startStage(si);

}

function shopRow(icon, name, sub, btnHtml, note){
  return `<div class="row"><span class="ricon" aria-hidden="true">${icon}</span><span class="rbody"><b>${name}</b><small>${sub}</small>${note?`<small class="rnote">${note}</small>`:""}</span>${btnHtml}</div>`;

function renderShop(){
  const tabs = [["nae","🌱 なえ・たね"],["tonari","🏡 となりの <ruby>農園<rt>のうえん</rt></ruby>"],["kaikon","⛏️ かいこん"]];

      const need = s.wide ? 2 : 1;
      let btn;
      if(have) btn = `<span class="have">うえた</span>`;
      else if(freeLand() < need) btn = `<button type="button" class="buy" disabled><ruby>土地<rt>とち</rt></ruby>が<br>たりない</button>`;
      else btn = `<button type="button" class="buy" data-buy="${s.key}" ${coins < s.price ? "disabled" : ""}><span class="coin">¥</span>${s.price}</button>`;
      body += shopRow(s.item, `${s.name}の ${s.kind}`, `とれる きせつ：${seaText(s)}`, btn);
    });

    body += `<p class="note" style="text-align:left"><ruby>売<rt>う</rt></ruby>り<ruby>上<rt>あ</rt></ruby>げが ふえると、となりの <ruby>農園<rt>のうえん</rt></ruby>から <ruby>生<rt>い</rt></ruby>きものや たねを <ruby>分<rt>わ</rt></ruby>けてもらえるよ。<br>これまでの <ruby>売<rt>う</rt></ruby>り<ruby>上<rt>あ</rt></ruby>げ：<b>${earned}まい</b></p>`;

      let btn, note = s.from;
      if(owned.has(s.key)) btn = `<span class="have">もらった</span>`;

        const blocked = s.needPond ? !pond : freeLand() < (s.wide?2:1);
        btn = `<button type="button" class="buy get" data-gift="${s.key}" ${blocked?"disabled":""}>${blocked ? (s.needPond ? "いけが<br>いる" : "<ruby>土地<rt>とち</rt></ruby>が<br>たりない") : "うけとる"}</button>`;
      } else btn = `<span class="have lock">あと<br>${s.gift-earned}まい</span>`;

      land >= LAND_MAX ? `<span class="have">もう<br><ruby>広<rt>ひろ</rt></ruby>げられない</span>` : `<button type="button" class="buy" data-land="1" ${coins < landCost() ? "disabled" : ""}><span class="coin">¥</span>${landCost()}</button>`);
    body += shopRow("💧", "<ruby>川<rt>かわ</rt></ruby>の <ruby>水<rt>みず</rt></ruby>を <ruby>引<rt>ひ</rt></ruby>いて いけを ほる", "ニジマスを そだてられる",
      pond ? `<span class="have">ほった</span>` : `<button type="button" class="buy" data-pond="1" ${coins < POND_PRICE ? "disabled" : ""}><span class="coin">¥</span>${POND_PRICE}</button>`);

    <div class="tabs" role="tablist">${tabs.map(([id,l])=>`<button type="button" role="tab" class="tab${id===shopTab?" on":""}${id==="tonari"&&giftReady.size?" dot":""}" data-tab="${id}" aria-selected="${id===shopTab}">${l}</button>`).join("")}</div>
    <div class="rows">${body}</div>

  const cardEl = $("card");
  cardEl.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ shopTab=b.dataset.tab; renderShop(); });

    addCoins(-s.price); owned.add(s.key); (s.also||[]).forEach(k=>owned.add(k)); fresh.add(s.key);
    sCoin(); sGrow(); renderShop(); renderFarm();
  });
  cardEl.querySelectorAll("[data-gift]").forEach(b=>b.onclick=()=>{
    const s = byKey(b.dataset.gift); giftReady.delete(s.key); owned.add(s.key); fresh.add(s.key);

  $("shopClose").onclick = closeCard; $("shopBack").onclick = closeCard;
  $("tutAgain").onclick = () => { tutorialDone = false; save(); closeCard(); };
  $("resetAll").onclick = () => {
    coins=0; earned=0; stars=0; updateRank(); land=LAND_START; pond=false; owned=new Set(["egg", ...STARTER[NOW_SEASON]]); zukan={}; zukanShown=false; year=1; yearNew=false;
    giftReady.clear(); giftShown.clear(); done.clear(); yamaShown=false; tutorialDone=false; season=NOW_SEASON; $("coins").textContent=0; showFarm();
  };
}

function showNewYear(){
  card(`
    <div class="big" aria-hidden="true">🎍🌸</div>
    <h2><b class="got-n">${year}</b><ruby>年目<rt>ねんめ</rt></ruby>に なった！</h2>
    <p>${year}<ruby>年目<rt>ねんめ</rt></ruby>の <ruby>春<rt>はる</rt></ruby>が きたよ。ことしも たくさん <ruby>売<rt>う</rt></ruby>ろう！</p>
    <div style="margin-top:14px"><button type="button" class="btn" id="nyOk"><ruby>農園<rt>のうえん</rt></ruby>へ</button></div>
  `);
  [523,659,784,659,784,1047].forEach((f,i)=>tone(f,.2,"sine",.12,i*.12));
  $("nyOk").onclick = closeCard;
}
const nextSeasonOf = () => SEASONS[(SEASONS.indexOf(seasonOf(season))+1) % SEASONS.length];
function goNextSeason(){
  const nx = nextSeasonOf();
  sSeason(nx.id); if(nx.id==="haru"){ year++; yearNew = true; }
  season = nx.id; [...done].forEach(k=>{ if(k.startsWith(nx.id+":")) done.delete(k); });
  showFarm();
}
function confirmSkip(rest){
  const cur = seasonOf(season), nx = nextSeasonOf();
  card(`
    <div class="big" aria-hidden="true">${cur.mark}➡${nx.mark}</div>
    <h2>${nx.label}へ すすむ？</h2>
    <p>まだ <ruby>売<rt>う</rt></ruby>って いない ものが <b>${rest}つ</b> あるよ。</p>
    <p class="note">${nx.label}へ すすむと、${cur.label}には もどれないよ。</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button type="button" class="btn sub" id="skipNo">${cur.label}で もっと <ruby>売<rt>う</rt></ruby>る</button>
      <button type="button" class="btn" id="skipYes">${nx.mark} ${nx.label}へ すすむ</button>
    </div>
  `);
  $("skipNo").onclick = closeCard;
  $("skipYes").onclick = goNextSeason;
}
function showFinal(){
  const cur = seasonOf(season), nx = nextSeasonOf();
  card(`
    <div class="big" aria-hidden="true">${cur.mark}🏮</div>
    <h2>${year}<ruby>年目<rt>ねんめ</rt></ruby>の ${cur.label}の ものを<br>ぜんぶ <ruby>売<rt>う</rt></ruby>り<ruby>切<rt>き</rt></ruby>った！</h2>
    <p>あつめた コイン：<b>${coins}まい</b></p>
    <p class="star">あつめた ★：${stars}こ</p>
    <p class="note">${nx.id==="haru" ? `つぎは ${year+1}<ruby>年目<rt>ねんめ</rt></ruby>の ${nx.label}！ ` : ""}${nx.label}に なると、ちがう ものが とれるよ。</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button type="button" class="btn sub" id="stay"><ruby>農園<rt>のうえん</rt></ruby>を <ruby>見<rt>み</rt></ruby>る</button>
      <button type="button" class="btn" id="nextSeason">${nx.mark} ${nx.label}へ すすむ</button>
    </div>
  `);
  [523,659,784,1047].forEach((f,i)=>tone(f,.25,"sine",.12,i*.12));
  $("stay").onclick = closeCard;
  $("nextSeason").onclick = goNextSeason;
}

load(); $("coins").textContent = coins; updateRank();
$("shopBtn").onclick = () => openShop(giftReady.size ? "tonari" : "nae");
showFarm();
</script>

</body></html>
